[project]
name = "practiceperfect-backend"
version = "0.1.0"
description = "User roles, authorization, and Super Admin user management"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "email-validator>=2.2",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
    "pwdlib[argon2]>=0.2.1",
    "pillow>=11.0",
    "aiosmtplib>=3.0",
    "python-multipart>=0.0.12",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
]

[project.scripts]
app-cli = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration", "tests/contract"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
warn_return_any = true
strict_equality = true
mypy_path = "src"
explicit_package_bases = true
