openapi: 3.1.0
info:
  title: PracticePerfect — User Roles, Authorization & Super Admin User Management
  version: 1.2.0
  description: |
    Contract for feature 001-user-roles-admin. Covers sign-in and session handling,
    invitation-driven first password setup, self-service profile editing for all four roles,
    and the Super Admin user directory with create, deactivate, reactivate, and erase.

    Version 1.1.0 adds the 2026-08-26 extension: the ShareLink invitation system players join
    through, the multi-trainer association and server-resolved trainer context it requires, and
    trainer portal branding. Those operations are grouped in the `join`, `trainer`, and `media`
    tags and under `/me/share-link`, `/me/trainers`, `/me/trainer-context`, and `/me/branding`.

    Authentication is a session cookie (see securitySchemes). Every response body is a
    Pydantic V2 model; no endpoint ever returns a database error, driver message, or stack
    trace (FR-056).

    Version 1.2.0 adds the 2026-08-27 extension: one account holding a whole family, the
    parent's control over which trainers each child trains with, a child's own constrained
    sign-in, and the Pending Parent Approval workflow. Those operations are grouped in the
    `family` and `approvals` tags and under `/me/players`, `/me/context`, `/me/approvals`, and
    `/me/requests`.

    **1.2.0 contains breaking changes**, made once while this repository's own frontend is the
    only consumer (research.md R-49). A trainer association now names a *player profile* rather
    than an account (FR-114), so: `PlayerParentDetail` loses the per-player fields, which are now
    per-profile; `TrainerPlayerSummary` names a profile and carries the responsible parent's
    contact detail; and `GET /me/trainers` plus `PUT /me/trainer-context` are replaced by
    `GET /me/contexts` plus `PUT /me/context`, whose subject is a profile-and-trainer pair. No
    versioned duplicate of any replaced operation is retained and the URL prefix stays
    `/api/v1` — this is a pre-release contract revision, not a second public version.

    Traceability: each operation carries `x-requirements` listing the spec requirements it
    satisfies.
servers:
  - url: /api/v1
    description: Versioned API root

tags:
  - name: auth
    description: Sign-in, sign-out, session inspection, first-password setup
  - name: me
    description: Self-service profile for the signed-in account
  - name: admin-users
    description: Super Admin user directory and lifecycle actions
  - name: media
    description: Delivery of stored profile photos (authenticated) and portal logos (public)
  - name: join
    description: Public invitation-link preview, registration, and association
  - name: trainer
    description: A trainer's own organization — currently their player roster
  - name: family
    description: A parent's own player profiles, their trainers, and their children's sign-ins
  - name: approvals
    description: Requests a child raised and the parent decides — the Pending Parent Approval workflow

security:
  - sessionCookie: []

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Sign in with email and password
      operationId: login
      security: []
      x-requirements: [FR-008, FR-009, FR-010, FR-011, FR-013, FR-026]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: |
            Signed in. Sets the session cookie and returns the current account summary.
          headers:
            Set-Cookie:
              description: 'pp_session=<opaque token>; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=604800'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401':
          description: |
            Credentials rejected. Returned identically for an unknown email, a wrong password,
            and an account that has no password set yet, so the response cannot be used to
            discover which emails are registered (FR-010).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: invalid_credentials
                  message: Email or password is incorrect.
        '403':
          description: |
            Credentials were correct but the account is not Active. Deliberately distinct from
            401, because FR-010 requires this case to say so (FR-010, second clause).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: account_not_active
                  message: Account deactivated. Contact support.
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      tags: [auth]
      summary: End the current session
      operationId: logout
      x-requirements: [FR-011]
      responses:
        '204':
          description: Session revoked and cookie cleared. Idempotent.
          headers:
            Set-Cookie:
              description: 'pp_session=; Max-Age=0'
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/session:
    get:
      tags: [auth]
      summary: Describe the current session's account
      operationId: getCurrentSession
      x-requirements: [FR-018, FR-019]
      description: |
        The frontend calls this on load to decide what to render. Advances the session's
        last-activity time, so it participates in the sliding inactivity window.
      responses:
        '200':
          description: The signed-in account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/setup-password/{token}:
    get:
      tags: [auth]
      summary: Check whether a setup link is still usable
      operationId: checkSetupInvitation
      security: []
      x-requirements: [FR-027]
      description: |
        Lets the set-password page show "this link has expired, request a new one" before the
        person types a password. Returns only whether the link is usable and the masked email
        it belongs to — never the account identifier or role.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      responses:
        '200':
          description: Link is usable.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [email_hint, expires_at]
                properties:
                  email_hint:
                    type: string
                    description: Partially masked address, e.g. 'a**@example.org'.
                    example: a**@example.org
                  expires_at: { type: string, format: date-time }
        '410':
          description: Link is consumed, expired, superseded, or its account is not Active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: invitation_not_usable
                  message: This setup link is no longer valid. Request a new one.

  /auth/setup-password:
    post:
      tags: [auth]
      summary: Set the first password using a setup link
      operationId: setupPassword
      security: []
      x-requirements: [FR-014, FR-026, FR-027]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, minLength: 32, maxLength: 128 }
                password: { $ref: '#/components/schemas/Password' }
      responses:
        '204':
          description: |
            Password set and the invitation consumed. No session is issued — the person signs
            in normally, which proves the credential works.
        '410':
          description: Link is consumed, expired, superseded, or its account is not Active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            Password rejected by policy — too short, or present in the breached-password list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                error:
                  code: validation_failed
                  message: One or more fields are invalid.
                  fields:
                    - field: password
                      message: Password must be at least 12 characters.

  /me/profile:
    get:
      tags: [me]
      summary: Read the signed-in account's own profile
      operationId: getOwnProfile
      x-requirements: [FR-017, FR-031]
      responses:
        '200':
          description: |
            The profile, including the role-specific block. `editable` and `read_only` are
            reported explicitly so the interface never has to hardcode which is which
            (FR-031, FR-033).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [me]
      summary: Update the signed-in account's own profile
      operationId: updateOwnProfile
      x-requirements: [FR-017, FR-032, FR-033, FR-036]
      description: |
        Accepts only the fields editable for the requester's role. Submitting `email`, `role`,
        `status`, `created_at`, or `skill_level` is rejected with 422 rather than silently
        ignored, so a mistaken client learns of its error (FR-033).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnProfileUpdate' }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: The account is Deleted and cannot be edited (FR-048).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/profile/photo:
    put:
      tags: [me]
      summary: Upload or replace the signed-in account's photo
      operationId: uploadOwnPhoto
      x-requirements: [FR-034]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG, or WebP, at most 5 MB.
      responses:
        '200':
          description: |
            Stored. Returns both URLs. Any previously stored original and thumbnail are deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoUrls' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '413':
          description: File exceeds 5 MB. The existing photo is unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: |
            Not a decodable JPEG, PNG, or WebP. Determined by decoding the bytes, not by the
            declared content type or the filename. The existing photo is unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: unsupported_image
                  message: Upload a JPEG, PNG, or WebP image no larger than 5 MB.
    delete:
      tags: [me]
      summary: Remove the signed-in account's photo
      operationId: deleteOwnPhoto
      x-requirements: [FR-035]
      responses:
        '204':
          description: Removed; the default avatar now applies. Idempotent.
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /media/photos/{key}:
    get:
      tags: [media]
      summary: Fetch a stored profile photo
      operationId: getPhoto
      x-requirements: [FR-034, FR-035]
      description: |
        Served through the application rather than a static mount so that the session check
        lives in one place and the storage layout stays private.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
        - name: variant
          in: query
          required: false
          schema:
            type: string
            enum: [original, thumb]
            default: original
      responses:
        '200':
          description: The image bytes.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users:
    get:
      tags: [admin-users]
      summary: Browse the platform-wide user directory
      operationId: listUsers
      x-requirements: [FR-016, FR-051, FR-052, SC-006]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: q
          in: query
          description: Case-insensitive partial match on name or email.
          schema: { type: string, maxLength: 200 }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/UserRole' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AccountStatus' }
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at_desc, created_at_asc, name_asc, name_desc]
            default: created_at_desc
      responses:
        '200':
          description: One page of the directory.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-users]
      summary: Create an account and send its setup invitation
      operationId: createUser
      x-requirements: [FR-021, FR-022, FR-023, FR-024, FR-025, FR-029, FR-030]
      description: |
        Creates the account with status Active and no password, creates the profile and the
        role detail row matching the role, writes the audit entry, and sends the invitation —
        all in one transaction, so a failure leaves no partial account behind (FR-024).

        `business_name` is required when `role` is `trainer` and rejected for other roles.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: |
            Created and invited. `invitation_sent` reports whether delivery succeeded; when
            false, the account still exists and the Super Admin should re-invite (FR-028).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The email already belongs to an account in any status (FR-004, FR-023).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: email_already_registered
                  message: An account with this email address already exists.
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [admin-users]
      summary: Read one account in full
      operationId: getUser
      x-requirements: [FR-016, FR-017, FR-051]
      responses:
        '200':
          description: |
            The account with its profile and role detail. Includes `version`, which the caller
            must echo on any subsequent status change (FR-010 concurrency, R-10).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{user_id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [admin-users]
      summary: Deactivate an account
      operationId: deactivateUser
      x-requirements: [FR-037, FR-038, FR-041, FR-042, FR-012, SC-007]
      description: |
        Moves an Active account to Inactive, revoking every session it holds in the same
        transaction. Refused when the target is the caller, or the last Active Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusChangeRequest' }
      responses:
        '200':
          description: Deactivated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StatusConflict' }
        '422':
          description: |
            The action is not permitted for this target: the account is not Active, it is the
            caller's own account, or it is the last Active Super Admin (FR-041).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                lastSuperAdmin:
                  value:
                    error:
                      code: last_super_admin
                      message: This is the only active Super Admin and cannot be deactivated.
                selfAction:
                  value:
                    error:
                      code: self_action_forbidden
                      message: You cannot deactivate your own account.

  /admin/users/{user_id}/reactivate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [admin-users]
      summary: Reactivate an inactive account
      operationId: reactivateUser
      x-requirements: [FR-040, FR-042]
      description: |
        Returns an Inactive account to Active with its existing password and profile intact.
        Refused for a Deleted account, because erasure is terminal (FR-048).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusChangeRequest' }
      responses:
        '200':
          description: Reactivated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StatusConflict' }
        '422':
          description: The account is not Inactive, or it is Deleted and cannot be restored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: erasure_is_permanent
                  message: This account was erased and cannot be reactivated.

  /admin/users/{user_id}/erase:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [admin-users]
      summary: Permanently erase an account's personal information
      operationId: eraseUser
      x-requirements: [FR-043, FR-044, FR-045, FR-046, FR-047, FR-048, FR-049, FR-041]
      description: |
        Irreversible. Anonymizes the account in place, revokes its sessions, supersedes any
        unconsumed invitation, deletes its stored photo files, and writes the compliance
        record — one transaction. Every historical record referencing the account survives
        untouched, so reporting totals do not move (FR-046, FR-047).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EraseUserRequest' }
      responses:
        '200':
          description: Erased. The returned account already shows its anonymized values.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StatusConflict' }
        '422':
          description: |
            Already Deleted, the caller's own account, or the last Active Super Admin
            (FR-041, FR-048).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/users/{user_id}/reinvite:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [admin-users]
      summary: Issue a fresh setup invitation
      operationId: reinviteUser
      x-requirements: [FR-028]
      description: |
        Valid only for an Active account that has never set a password. Supersedes any
        outstanding invitation, so exactly one link is live at a time.
      responses:
        '200':
          description: A new invitation was issued.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [invitation_sent, expires_at]
                properties:
                  invitation_sent: { type: boolean }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The account already has a password, or is not Active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/users/{user_id}/audit:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [admin-users]
      summary: Read the audit trail for one account
      operationId: listUserAudit
      x-requirements: [FR-054, FR-055]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Audit entries where this account is the target, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/erasure-records/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [admin-users]
      summary: Read the compliance record for an erased account
      operationId: getErasureRecord
      x-requirements: [FR-049]
      description: |
        The only route that exposes an erased account's original identity. Super Admin only,
        and never joined into any account view.
      responses:
        '200':
          description: The compliance record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErasureRecord' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No erasure record exists for this account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------------------
  # Extension (2026-08-26): ShareLink onboarding, multi-trainer context, branding
  # ---------------------------------------------------------------------------

  /join/{code}:
    parameters:
      - $ref: '#/components/parameters/ShareLinkCode'
    get:
      tags: [join]
      summary: Preview the trainer behind an invitation link
      operationId: previewJoinLink
      security: []
      x-requirements: [FR-070, FR-071, FR-073]
      description: |
        Public and unauthenticated — this is the first thing a flyer's reader reaches. Returns
        only what the join page must show: the trainer's business name and branding.

        Every refusal reason — unknown code, revoked, expired, exhausted, trainer not Active —
        returns the same 404 with the same message and no trainer detail, so the endpoint
        cannot be used to enumerate codes or confirm a trainer exists (FR-070).

        Throttled per origin: 10 unsuccessful lookups in 15 minutes and further lookups are
        refused, sliding (FR-071, R-30).
      responses:
        '200':
          description: The link is usable. Render the join page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinLinkPreview' }
        '404':
          description: The link is not valid. One message for every cause (FR-070).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: invitation_link_invalid
                  message: This link is no longer valid.
        '429': { $ref: '#/components/responses/LookupThrottled' }

  /join/{code}/register:
    parameters:
      - $ref: '#/components/parameters/ShareLinkCode'
    post:
      tags: [join]
      summary: Register a new player account and join the trainer
      operationId: registerThroughJoinLink
      security: []
      x-requirements: [FR-074, FR-075, FR-076, FR-077, FR-078, FR-079, FR-083]
      description: |
        Creates the account, its profile, its player detail and parent contact rows, the
        association with the link's trainer, and a session — in **one** transaction. A failure
        at any point leaves nothing behind (FR-083, R-23).

        On success the response sets the session cookie, so the person is signed in without a
        second step (FR-078), and `active_trainer_id` is the link's trainer.

        `date_of_birth` rather than an age: the age FR-077 constrains is derived from it, so
        the stored value does not decay (R-31). When `is_self` is true the derived age must be
        18 or above; when false it must be between 1 and 18.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinRegistrationRequest' }
      responses:
        '201':
          description: Account created, joined, and signed in. Sets the session cookie.
          headers:
            Set-Cookie:
              description: Session cookie, as on sign-in (FR-011).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinResult' }
        '404':
          description: The link is not valid (FR-070).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The email already belongs to an account in any status (FR-076).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: email_already_registered
                  message: An account with this email already exists. Sign in, then open the link again.
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/LookupThrottled' }

  /join/{code}/accept:
    parameters:
      - $ref: '#/components/parameters/ShareLinkCode'
    post:
      tags: [join]
      summary: Join the trainer as an already signed-in player
      operationId: acceptJoinLink
      x-requirements: [FR-080, FR-081, FR-082, FR-084, FR-085, FR-122, FR-132, FR-137]
      description: |
        The account already exists (FR-080). Creates the associations and switches the caller's
        active context to the new trainer.

        **Changed in 1.2.0**: the body now says *who* joins. A parent holding children selects
        family members (FR-122, Story 13); an account holding exactly one profile may send no
        body at all and that profile is used, which is the 1.1.0 behaviour unchanged. Selecting
        nobody associates nobody and changes nothing.

        Profiles already joined to this trainer are reported back in
        `already_associated_profile_ids`, create nothing, and do **not** raise the link's use
        count (FR-082); the count rises by exactly the number of new associations (FR-068).

        A caller whose role is not `player_parent` is refused and nothing is written (FR-081). A
        **signed-in child** is refused with `child_must_ask_parent`: no association is created,
        the parent is emailed, and an approval request of kind `join_trainer` is raised for them
        to decide (FR-137, FR-138). Repeating it raises no second request and sends no second
        email (FR-139, R-51).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinAcceptRequest' }
      responses:
        '200':
          description: |
            Associated, already associated, or nothing selected. The active context is the
            link's trainer unless nothing was selected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: |
            The caller's role cannot join through a player link (FR-081), or the caller is a
            child, who must ask their parent (FR-137).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                roleCannotJoin:
                  value:
                    error:
                      code: role_cannot_join
                      message: This link is for players and parents.
                childMustAskParent:
                  value:
                    error:
                      code: child_must_ask_parent
                      message: Ask your parent to register you with this trainer.
        '404':
          description: The link is not valid (FR-070).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/LookupThrottled' }

  /me/share-link:
    get:
      tags: [me]
      summary: Read this trainer's standing player invitation link
      operationId: getOwnShareLink
      x-requirements: [FR-065, FR-067, FR-069]
      description: |
        Trainer only. A pure read — the link was created with the account (R-22), so this
        endpoint never writes. `url` is absolute and ready to copy onto a flyer; `code` is
        given separately for clients that build their own display.
      responses:
        '200':
          description: The trainer's current standing link, with its usage counters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareLink' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/share-link/regenerate:
    post:
      tags: [me]
      summary: Replace this trainer's invitation link with a fresh one
      operationId: regenerateOwnShareLink
      x-requirements: [FR-069]
      description: |
        Revokes the current code and issues a new one in the same transaction. The old code
        stops admitting anyone immediately (SC-020); every association it already produced is
        untouched, which is why the old row is retained rather than deleted.
      responses:
        '201':
          description: The new link. The previous code is dead from this moment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareLink' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/contexts:
    get:
      tags: [me]
      summary: List the profile-and-trainer pairs this account can look at
      operationId: listOwnContexts
      x-requirements: [FR-114, FR-117, FR-118, FR-119, FR-120]
      description: |
        Player/Parent only. Backs the context switcher, and **replaces `GET /me/trainers`**,
        whose entries named a trainer alone (R-49). Returns only Active associations whose
        trainer account is Active and whose profile is live (FR-089, FR-120); an entry is
        therefore always switchable. One entry means the interface shows no switcher
        (FR-118, FR-119); an empty list means the person belongs to no trainer, which is valid.

        A parent receives one entry per profile-and-trainer pair across every profile on the
        account, each naming its profile so the interface can group the account holder's own
        training separately from each child's (FR-118). A signed-in child receives only the
        pairs of the single profile their sign-in is attached to — no sibling and no parent
        entry appears, and the grouping is flat (FR-119, FR-132).
      responses:
        '200':
          description: The caller's switchable pairs, and which one is active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingContextList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/context:
    put:
      tags: [me]
      summary: Switch which player profile and trainer this account is looking at
      operationId: switchTrainingContext
      x-requirements: [FR-117, FR-119, FR-120, FR-132]
      description: |
        The only way context changes, and **replaces `PUT /me/trainer-context`** (R-49). The
        subject is a *pair*, because FR-117 makes the isolation boundary a profile and a trainer
        together — a sibling is on the same account, so naming only the trainer would not
        identify a context.

        The trainer is named **in this body, never as a path or query parameter**: context stays
        server-resolved everywhere else (R-25), and CI fails the build on a `trainer_id` request
        parameter outside the admin router.

        A pair the caller cannot reach returns **404, not 403** — for the reason FR-090 already
        established for trainers, and now also for a sibling's profile, which a child must not
        be able to confirm exists (FR-132, R-48).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainingContextRequest' }
      responses:
        '200':
          description: |
            The new active context. The client discards every cached context-scoped response
            before rendering, under the `['ctx', profileId, trainerId, …]` namespace (R-26, R-47).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingContextList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            No such reachable pair: the profile is not one the caller may look at, the
            association is not Active, or the trainer is not Active. One message for all three
            (FR-090, FR-132).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/branding:
    get:
      tags: [me]
      summary: Read this trainer's portal branding
      operationId: getOwnBranding
      x-requirements: [FR-093, FR-104]
      description: Trainer only. Absent values mean the platform default, never an empty string.
      responses:
        '200':
          description: The trainer's stored branding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalBranding' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [me]
      summary: Set or clear the primary brand colour
      operationId: updateOwnBranding
      x-requirements: [FR-093, FR-098, FR-102, FR-104]
      description: |
        An omitted key leaves the colour unchanged; an explicit `null` clears it back to the
        platform default (constitution Principle VI). The colour is stored exactly as chosen —
        the readable palette is derived at render time, so no derived value is persisted (R-29).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalBrandingUpdate' }
      responses:
        '200':
          description: The stored branding after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalBranding' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/branding/logo:
    put:
      tags: [me]
      summary: Upload this trainer's portal logo
      operationId: uploadOwnLogo
      x-requirements: [FR-094, FR-095, FR-096, FR-103]
      description: |
        Trainer only. PNG, JPEG, or SVG, at most 2 MB.

        Raster uploads are decode-validated and, above 200×200, fitted to it preserving aspect
        ratio rather than refused (FR-096). SVG uploads are screened before storage — DOCTYPE
        refused, then scripts, `foreignObject`, `on*` attributes, and non-fragment references
        rejected (FR-095, R-27) — and are not resized, because they scale.

        Replacing a logo removes the previous file (FR-103).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: The stored branding, with the new logo URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalBranding' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: Over 2 MB (FR-094).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            Not a PNG, JPEG, or SVG; declared type does not match the decoded content; or the
            SVG failed screening (FR-094, FR-095).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
    delete:
      tags: [me]
      summary: Remove this trainer's portal logo
      operationId: deleteOwnLogo
      x-requirements: [FR-100, FR-103]
      responses:
        '204':
          description: Logo cleared and its file removed. The platform default renders.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/branding/reset:
    post:
      tags: [me]
      summary: Reset branding to the platform default
      operationId: resetOwnBranding
      x-requirements: [FR-100, FR-103]
      description: Clears logo and colour together and removes the stored logo file.
      responses:
        '200':
          description: Branding after the reset — every value absent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalBranding' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /media/branding/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string, maxLength: 128 }
    get:
      tags: [media]
      summary: Fetch a stored portal logo
      operationId: getBrandingLogo
      security: []
      x-requirements: [FR-073, FR-095, FR-101]
      description: |
        **Unauthenticated**, unlike `/media/photos/{key}`, because FR-073 requires the join
        page to show a trainer's branding before anyone has an account. A logo is published
        material; a profile photo is not.

        SVG responses carry `X-Content-Type-Options: nosniff` and
        `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'`. Clients must
        render logos through `<img>` only — never `<object>`, `<embed>`, or inline (R-27).
      responses:
        '200':
          description: The image.
          headers:
            Cache-Control:
              schema: { type: string, example: 'public, max-age=300' }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
            Content-Security-Policy:
              description: Sent for SVG responses.
              schema: { type: string }
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/svg+xml:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /trainer/players:
    get:
      tags: [trainer]
      summary: List the players associated with this trainer
      operationId: listTrainerPlayers
      x-requirements: [FR-090, FR-091, SC-025]
      description: |
        Trainer only, and scoped to the caller's own associations — there is no parameter that
        could widen it.

        Nothing in the response says whether a player also trains with another trainer: no
        other-trainer identifier, no count of trainers, no join date from elsewhere (FR-090,
        SC-025).

        An erased player appears here as "Deleted User" with the association intact, which is
        what keeps participant counts stable (FR-091, SC-008).
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: q
          in: query
          description: Case-insensitive partial match on the player's name.
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: One page of this trainer's roster.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainerPlayerPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------------------
  # Extension (2026-08-27): parent/child family accounts, child sign-in,
  # and the Pending Parent Approval workflow
  # ---------------------------------------------------------------------------

  /me/players:
    get:
      tags: [family]
      summary: List the player profiles on this account
      operationId: listOwnPlayers
      x-requirements: [FR-106, FR-112, FR-124]
      description: |
        Player/Parent only. The family page: the account holder's own profile if they train,
        plus every child, each with the trainers it is associated with and the date each
        association began (FR-124).

        A signed-in child receives only their own profile (FR-132) — a sibling never appears,
        which is enforced in the same place every context decision is made (R-48).
      responses:
        '200':
          description: The live profiles on this account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerProfileList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [family]
      summary: Add a child profile to this account
      operationId: createOwnChildPlayer
      x-requirements: [FR-106, FR-107, FR-108, FR-110, FR-112, FR-122, FR-123]
      description: |
        Parent only — a signed-in child cannot own a profile (FR-132).

        Creates one `child` profile and associates it with exactly the trainers named in
        `trainer_ids`, which the interface has gathered by asking the question FR-122 describes:
        a single yes/no naming the one trainer, a checklist when there are several, nothing at
        all when the parent has none. An empty or omitted list creates the profile with no
        association, which is valid (FR-123, Story 9 scenario 4).

        An age outside 1–18 is a 422 on `date_of_birth` (FR-108). A near-duplicate is a **409**
        the parent may overrule by resending with `acknowledge_possible_duplicate: true`
        (FR-110, R-45) — a warning that does not block, expressed as a refusal that can be
        retried rather than a note attached to something already created.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateChildProfileRequest' }
      responses:
        '201':
          description: The created child profile with its associations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            A profile of a closely similar name and the same date of birth already exists on
            this account. Resend with `acknowledge_possible_duplicate: true` to create it
            anyway (FR-110).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuplicateProfileError' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/players/{profile_id}:
    parameters:
      - $ref: '#/components/parameters/PlayerProfileId'
    get:
      tags: [family]
      summary: Read one player profile on this account
      operationId: getOwnPlayer
      x-requirements: [FR-112, FR-124, FR-132]
      description: |
        A profile the caller may not reach returns **404, not 403** — for a profile on another
        account, and for a sibling when the caller is a child. A refusal that distinguished the
        two would confirm the sibling exists (FR-112, FR-132, R-48).
      responses:
        '200':
          description: The profile and its associations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [family]
      summary: Update a player profile on this account
      operationId: updateOwnPlayer
      x-requirements: [FR-107, FR-111, FR-112, FR-131, FR-132, FR-147]
      description: |
        A partial update, following the same null semantics as every other PATCH in this
        contract: an omitted key leaves its value untouched, an explicit `null` clears it, and
        the empty string is a 422 naming the field (FR-059, constitution Principle VI).

        Who may change what differs by caller, and the difference is enforced on the request
        rather than by withholding a control (FR-133):

        - The **owning parent** may change every writable field, including
          `tokens_without_approval` (FR-147).
        - A **signed-in child**, on their own profile only, may change `photo_key` through the
          photo endpoint and nothing else here. Any other field — and in particular
          `tokens_without_approval` — is a 403 (FR-131, FR-132).

        `first_name` and `last_name` are writable only on a `child` profile; on a `self` profile
        they are absent by design and supplying them is a 422, because the name is the account's
        (R-37). `skill_level` is never writable (FR-107).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlayerProfileUpdate' }
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: A child attempted a field only the parent may change (FR-132).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: parent_only_field
                  message: Only a parent can change this setting.
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

    delete:
      tags: [family]
      summary: Remove a player profile from this account
      operationId: deleteOwnPlayer
      x-requirements: [FR-111, FR-112, FR-132, FR-135]
      description: |
        Parent only. A **soft** removal: the profile stops appearing on the family page and on
        every trainer's roster, and every historical record attached to it survives untouched,
        exactly as a deactivated account's history does (FR-111, and §29 of the data model).

        Any sign-in granted to this child stops working immediately and its sessions are
        revoked — a credential never outlives the player it belongs to (FR-135).
      responses:
        '204':
          description: Removed. Nothing is returned.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/players/{profile_id}/photo:
    parameters:
      - $ref: '#/components/parameters/PlayerProfileId'
    put:
      tags: [family]
      summary: Upload a photo for a player profile
      operationId: uploadOwnPlayerPhoto
      x-requirements: [FR-107, FR-131, FR-132]
      description: |
        Accepted for the owning parent on any profile, and for a signed-in child on their own
        profile — updating their own photo is one of the few things FR-131 permits them.

        Same limits and same validation as a profile photo: the file must decode as JPEG, PNG,
        or WebP and be at most 5 MB, and the declared content type must match what it decodes
        as (FR-034, R-07). A `self` profile has no photo of its own — use `PUT /me/profile/photo`
        instead, and a request here for one is a 422 (R-37).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: The stored photo's API-relative URLs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoUrls' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/players/{profile_id}/trainers:
    parameters:
      - $ref: '#/components/parameters/PlayerProfileId'
    post:
      tags: [family]
      summary: Add a trainer to a player profile
      operationId: addOwnPlayerTrainer
      x-requirements: [FR-125, FR-127, FR-128, FR-132]
      description: |
        Parent only — a child cannot change any association, including their own (FR-128,
        FR-132).

        Two ways in, exactly as FR-125 states: supply the trainer's invitation `code`, validated
        under the same five-part predicate as any other use of it (FR-070); or name a
        `trainer_id` the account is already associated with through some profile. Exactly one of
        the two must be present.

        The trainer is named **in this body, never in the path** — see `PUT /me/context` for why
        (R-25, R-48).

        Re-adding a trainer a profile was previously removed from reuses the same profile and
        keeps its earlier history (FR-127). Adding one already active returns 200 and writes
        nothing (Story 10 scenario 4).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddPlayerTrainerRequest' }
      responses:
        '200':
          description: |
            Associated, or already associated. The profile's full association list is returned
            so the family page needs no second read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            No such profile, no valid invitation link, or no such trainer among those this
            account already trains with. One message for all three (FR-070, FR-090).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/LookupThrottled' }

  /me/players/{profile_id}/trainers/{association_id}:
    parameters:
      - $ref: '#/components/parameters/PlayerProfileId'
      - $ref: '#/components/parameters/AssociationId'
    delete:
      tags: [family]
      summary: Remove a trainer from a player profile
      operationId: removeOwnPlayerTrainer
      x-requirements: [FR-126, FR-128, FR-132]
      description: |
        Parent only (FR-128). The association becomes inactive: the trainer's roster no longer
        lists this player, and every record of what already happened under it survives
        (FR-126).

        Addressed by the **association's** identifier rather than the trainer's — better
        addressing, and it keeps the trainer's identifier out of path parameters where CI
        forbids it (R-48).

        The interface must have confirmed first, naming the player and the trainer and stating
        that upcoming reservations with that trainer will be cancelled (FR-126). Those
        reservations do not exist until Epic-02; the statement is the requirement this feature
        can satisfy, and the cancellation belongs to the epic that creates the thing cancelled.
      responses:
        '204':
          description: Removed. Nothing is returned.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such association on a profile this caller owns.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/players/{profile_id}/sign-in:
    parameters:
      - $ref: '#/components/parameters/PlayerProfileId'
    put:
      tags: [family]
      summary: Grant a child their own sign-in
      operationId: grantOwnChildSignIn
      x-requirements: [FR-129, FR-130, FR-132, FR-135]
      description: |
        Parent only, and only for a `child` profile — a `self` profile's sign-in is the account
        itself (R-37).

        Creates a `player_parent` account holding the supplied email and invites the child to
        choose their own password through the same single-use setup link any invited account
        uses (FR-025 – FR-027). The address is subject to the existing uniqueness rule across
        every status, so the parent's own address is refused rather than shared (FR-004,
        FR-129).

        Every notification about this child continues to reach the **parent's** address. The
        child's address receives only their own credential mail (FR-130).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantChildSignInRequest' }
      responses:
        '201':
          description: |
            The sign-in was created and the setup invitation sent. `invitation_sent` is false
            when delivery failed, which is not reported as success (FR-064).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChildSignIn' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The email already belongs to an account in any status (FR-004, FR-129).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: email_already_registered
                  message: That email address is already in use.
        '422': { $ref: '#/components/responses/ValidationFailed' }

    delete:
      tags: [family]
      summary: Revoke a child's sign-in
      operationId: revokeOwnChildSignIn
      x-requirements: [FR-134]
      description: |
        Parent only. The child can no longer sign in and every session they hold stops working
        immediately, under the same mechanism that revokes sessions when an account leaves
        Active status (FR-012).

        The child's profile, associations, and history are untouched — this removes a way in,
        not a player (FR-134).
      responses:
        '204':
          description: Revoked. Nothing is returned.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/requests:
    get:
      tags: [approvals]
      summary: List the requests this child raised
      operationId: listOwnRaisedRequests
      x-requirements: [FR-131, FR-153]
      description: |
        The child's own view: what they asked for and where each request stands, including the
        parent's note when the parent denied it or asked for more information (FR-153).

        A parent calling this receives the requests they raised, which is normally none —
        requests are raised by children. The parent's decision queue is `/me/approvals`.
      parameters:
        - name: status
          in: query
          description: Filter to one status. Omitted, every status is returned, newest first.
          schema: { $ref: '#/components/schemas/ApprovalRequestStatus' }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: One page of the caller's own requests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequestPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/requests/{request_id}/withdraw:
    parameters:
      - $ref: '#/components/parameters/ApprovalRequestId'
    post:
      tags: [approvals]
      summary: Withdraw a request this child raised
      operationId: withdrawOwnRequest
      x-requirements: [FR-154, FR-156]
      description: |
        Only the child the request concerns, and only while it is still live. The request closes
        as `withdrawn`, the action is not carried out, and it leaves the parent's queue
        (FR-154).

        A request already resolved — approved, denied, expired, or withdrawn — returns **409**,
        because resolution happens exactly once (FR-156, R-41).
      responses:
        '200':
          description: Withdrawn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RequestAlreadyResolved' }

  /me/approvals:
    get:
      tags: [approvals]
      summary: List the requests awaiting this parent's decision
      operationId: listOwnApprovals
      x-requirements: [FR-149, FR-159]
      description: |
        Parent only. Each entry carries the child, what is asked, the amount when the request is
        financial, when it was raised, and when it expires — from which the interface derives
        the time remaining (FR-149).

        Defaults to the live statuses, because this is a decision queue rather than a history.
        Pass `status` to read the rest. Reached from the navigation frame with a count while any
        are pending, which is what makes the workflow reachable by clicking (FR-159, FR-105).
      parameters:
        - name: status
          in: query
          description: |
            Filter to one status. Omitted, only `pending_parent_approval` and `info_requested`
            are returned, oldest deadline first.
          schema: { $ref: '#/components/schemas/ApprovalRequestStatus' }
        - name: player_profile_id
          in: query
          description: Filter to one child. Must be a profile on the caller's account.
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: One page of the caller's decision queue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequestPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/approvals/{request_id}:
    parameters:
      - $ref: '#/components/parameters/ApprovalRequestId'
    get:
      tags: [approvals]
      summary: Read one request awaiting this parent
      operationId: getOwnApproval
      x-requirements: [FR-141, FR-149]
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/approvals/{request_id}/approve:
    parameters:
      - $ref: '#/components/parameters/ApprovalRequestId'
    post:
      tags: [approvals]
      summary: Approve a child's request and carry the action out
      operationId: approveOwnApproval
      x-requirements: [FR-142, FR-144, FR-150, FR-151, FR-152, FR-156, FR-157, FR-158]
      description: |
        Parent only, and only the parent this request names (or a Super Admin acting in
        support). The requested action is carried out **in the same transaction** as the status
        change, under exactly the rules that would apply had the parent performed it themselves
        (FR-151), and exactly once (FR-144).

        When the action cannot be completed — the invitation link has since been revoked, the
        trainer is no longer Active, the profile has been removed — the response is **422**
        naming the cause, the request is **not** recorded as approved, and it stays in the
        parent's queue awaiting a further decision (FR-151, R-42).

        A financial request is refused with **422 `approval_kind_not_executable`** while no
        executor is registered for its kind: taking payment and debiting tokens belong to
        Epic-05, and FR-142 forbids marking such a request approved before the act can be
        performed (R-46). This is a known and intended gap.

        An amount that no longer matches what the parent was shown is refused rather than
        charged at the new figure (FR-152).

        A request already resolved returns **409**; where two approvals arrive together exactly
        one takes effect and the other receives that 409 (FR-156, SC-038, R-41).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecisionRequest' }
      responses:
        '200':
          description: Approved, and the action carried out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RequestAlreadyResolved' }
        '422':
          description: |
            The approval could not be completed, and nothing was recorded as approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                subjectUnavailable:
                  value:
                    error:
                      code: approval_subject_unavailable
                      message: That trainer is no longer available. The request is still waiting for you.
                notExecutable:
                  value:
                    error:
                      code: approval_kind_not_executable
                      message: This kind of request cannot be completed yet.
                amountChanged:
                  value:
                    error:
                      code: approval_amount_changed
                      message: The amount has changed since this request was made.

  /me/approvals/{request_id}/deny:
    parameters:
      - $ref: '#/components/parameters/ApprovalRequestId'
    post:
      tags: [approvals]
      summary: Deny a child's request
      operationId: denyOwnApproval
      x-requirements: [FR-149, FR-150, FR-153, FR-156, FR-158]
      description: |
        The action is not carried out, the request closes as `denied`, and the child is told —
        with the parent's note when one was given (FR-149, FR-153).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecisionRequest' }
      responses:
        '200':
          description: Denied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RequestAlreadyResolved' }

  /me/approvals/{request_id}/request-info:
    parameters:
      - $ref: '#/components/parameters/ApprovalRequestId'
    post:
      tags: [approvals]
      summary: Ask the child for more information before deciding
      operationId: requestInfoOnOwnApproval
      x-requirements: [FR-143, FR-150, FR-153, FR-155]
      description: |
        Moves the request to `info_requested` and shows the child the parent's note, which is
        required here (FR-150). The child replies through
        `POST /me/requests/{request_id}/respond`, which returns it to
        `pending_parent_approval`.

        The 48-hour deadline is **not** restarted — it is an absolute timestamp written when the
        request was raised, so a request cannot be held open indefinitely by repeated questions
        (FR-155, R-43).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalInfoRequest' }
      responses:
        '200':
          description: Information requested.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RequestAlreadyResolved' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/requests/{request_id}/respond:
    parameters:
      - $ref: '#/components/parameters/ApprovalRequestId'
    post:
      tags: [approvals]
      summary: Reply to a parent's request for more information
      operationId: respondToOwnRequest
      x-requirements: [FR-143, FR-153, FR-155]
      description: |
        Only the child the request concerns, and only from `info_requested`. Returns the request
        to `pending_parent_approval` with the child's note attached, without restarting the
        deadline (FR-143, FR-155).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalInfoRequest' }
      responses:
        '200':
          description: Replied; the request is pending again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The request is not awaiting information.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: pp_session
      description: |
        Opaque server-side session token. HttpOnly, Secure, SameSite=Lax. Sliding 7-day
        inactivity expiry. Revoked on sign-out and the moment the account leaves Active
        status (FR-011, FR-012).

  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShareLinkCode:
      name: code
      in: path
      required: true
      description: The invitation link's code, exactly as issued (R-21).
      schema: { type: string, minLength: 8, maxLength: 64 }
    PlayerProfileId:
      name: profile_id
      in: path
      required: true
      description: |
        A player profile on the caller's own account. Unreachable profiles — another account's,
        or a sibling's when the caller is a child — are 404 rather than 403 (FR-112, R-48).
      schema: { type: string, format: uuid }
    AssociationId:
      name: association_id
      in: path
      required: true
      description: |
        A trainer association's own identifier. Associations are addressed this way rather than
        by the trainer's identifier, which CI forbids in a path parameter (R-25, R-48).
      schema: { type: string, format: uuid }
    ApprovalRequestId:
      name: request_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthenticated:
      description: No valid session, or the session's account is no longer Active (FR-018).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: not_authenticated
              message: Sign in to continue.
    Forbidden:
      description: |
        The session is valid but the role may not perform this action. Recorded as a
        `permission_denied` audit entry (FR-020).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: forbidden
              message: Your role does not permit this action.
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: |
        One or more fields failed validation. Every offending field is listed, so the
        interface can mark each one rather than showing a single generic failure (FR-022).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    RateLimited:
      description: |
        Too many failed sign-in attempts for this email or from this address. Retry after the
        stated interval; access resumes automatically (FR-013, SC-011).
      headers:
        Retry-After:
          description: Seconds until attempts are accepted again.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: too_many_attempts
              message: Too many attempts. Try again in a few minutes.
    LookupThrottled:
      description: |
        Too many unsuccessful invitation-code lookups from this origin. Retry after the stated
        interval; access resumes automatically (FR-071, SC-021, R-30).
      headers:
        Retry-After:
          description: Seconds until lookups are accepted again.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: too_many_attempts
              message: Too many attempts. Try again in a few minutes.

    StatusConflict:
      description: |
        The account changed since it was read. The caller's `version` did not match. Re-read
        and retry (R-10).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: stale_version
              message: This account was changed by someone else. Reload and try again.
    RequestAlreadyResolved:
      description: |
        The approval request has already been approved, denied, withdrawn, or has expired.
        Resolution happens exactly once: where two decisions arrive together, one takes effect
        and the other receives this (FR-156, SC-038, R-41).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: request_already_resolved
              message: This request has already been decided.

  schemas:
    UserRole:
      type: string
      enum: [super_admin, trainer, coach, player_parent]

    AccountStatus:
      type: string
      enum: [active, inactive, deleted]

    Password:
      type: string
      minLength: 12
      maxLength: 128
      format: password
      description: At least 12 characters and not present in the breached-password list (FR-014).

    Error:
      type: object
      additionalProperties: false
      required: [error]
      description: |
        The single error envelope for every failure. Carries a stable machine-readable `code`
        and a message safe to show a user. Never carries internal detail (FR-056).
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, example: forbidden }
            message: { type: string }

    ValidationError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, fields]
          properties:
            code: { type: string, enum: [validation_failed] }
            message: { type: string }
            fields:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, message]
                properties:
                  field: { type: string, example: phone }
                  message: { type: string, example: Enter a valid phone number. }

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 128 }

    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, email, role, status, first_name, last_name, photo_url]
      description: The minimum the interface needs to render for a signed-in person.
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        first_name: { type: string }
        last_name: { type: string }
        photo_url:
          type: [string, 'null']
          description: |
            API-relative path, resolved against this document's server base path. A client
            rendering it in a DOM `src` MUST prefix its own API base URL. Null when no photo is
            stored; the interface shows the default avatar.
        active_player_profile_id:
          type: [string, 'null']
          format: uuid
          description: |
            Which player profile the caller is currently looking at. Player/Parent only, and
            null for every other role and for an account with no reachable context. Together
            with `active_trainer_id` this is the pair every player-facing read is scoped to
            (FR-117).
        active_trainer_id:
          type: [string, 'null']
          format: uuid
          description: |
            The trainer half of the active pair. Null under the same conditions as
            `active_player_profile_id`; the two are always both set or both null. Changed only
            through `PUT /me/context` — no other endpoint accepts a trainer identifier (R-25).
        context_count:
          type: integer
          default: 0
          description: |
            How many switchable profile-and-trainer pairs the caller has, **replacing
            `trainer_count`** (R-49). The interface shows the switcher only above one
            (FR-118, FR-119). Zero for every non-player role.
        is_child_account:
          type: boolean
          default: false
          description: |
            True when this account is a child's own sign-in — derived from the existence of a
            player profile naming it, never stored as a column (R-38). The interface uses it to
            withhold the controls FR-132 forbids; the platform refuses those actions on the
            request regardless (FR-133).
        portal_branding:
          $ref: '#/components/schemas/PortalBranding'
          description: |
            The branding to paint for this viewer, resolved server-side: a trainer's own, a
            player's active context's, the platform default otherwise (FR-101). Coaches receive
            the default until US-01.08 establishes which trainer they work for (research R-33).

    PhotoUrls:
      type: object
      additionalProperties: false
      required: [photo_url, thumbnail_url]
      description: |
        Both are API-relative paths, resolved against this document's server base path — not
        absolute URLs and not paths relative to the web application's own origin. A client
        rendering either in a DOM `src` MUST prefix its API base URL; requests issued through the
        API client resolve without further work.
      properties:
        photo_url: { type: string }
        thumbnail_url: { type: string }

    TrainerDetail:
      type: object
      additionalProperties: false
      required: [business_name]
      properties:
        business_name: { type: string, minLength: 1, maxLength: 200 }
        address: { type: [string, 'null'], maxLength: 500 }
        website: { type: [string, 'null'], maxLength: 500, format: uri }
        description: { type: [string, 'null'], maxLength: 2000 }

    CoachDetail:
      type: object
      additionalProperties: false
      required: [is_publicly_visible]
      properties:
        bio: { type: [string, 'null'], maxLength: 2000 }
        credentials: { type: [string, 'null'], maxLength: 1000 }
        certifications: { type: [string, 'null'], maxLength: 1000 }
        is_publicly_visible: { type: boolean }

    PlayerParentDetail:
      type: object
      additionalProperties: false
      description: |
        What remains true of the *account* rather than of any one player on it: the family's
        emergency contact, held once and serving every child (FR-113).

        **Changed in 1.2.0.** `school`, `jersey_number`, and `skill_level` were removed — they
        describe one player, and an account now holds several (FR-106, FR-114). They live on
        `PlayerProfile` and are reached through `/me/players` (R-34, R-49).
      properties:
        emergency_contact_name: { type: [string, 'null'], maxLength: 200 }
        emergency_contact_phone: { type: [string, 'null'], maxLength: 32 }
        emergency_contact_relation: { type: [string, 'null'], maxLength: 100 }
        profile_count:
          type: integer
          readOnly: true
          description: |
            How many live player profiles the account holds — the account holder's own, if they
            train, plus each child. Zero is valid for an account created by a Super Admin.

    RoleDetail:
      description: |
        The role-specific block. Discriminated by the account's role, so the frontend narrows
        it with a type guard rather than reaching for `any` (constitution Principle II).
      oneOf:
        - $ref: '#/components/schemas/TrainerDetail'
        - $ref: '#/components/schemas/CoachDetail'
        - $ref: '#/components/schemas/PlayerParentDetail'
        - type: 'null'
          description: Super Admin accounts carry no role detail block.

    OwnProfile:
      type: object
      additionalProperties: false
      required: [id, email, role, status, created_at, first_name, last_name, phone, photo_url, thumbnail_url, role_detail, editable_fields]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, readOnly: true }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        created_at: { type: string, format: date-time, readOnly: true }
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: [string, 'null'] }
        photo_url: { type: [string, 'null'], description: API-relative; see PhotoUrls. }
        thumbnail_url: { type: [string, 'null'], description: API-relative; see PhotoUrls. }
        role_detail: { $ref: '#/components/schemas/RoleDetail' }
        editable_fields:
          type: array
          description: |
            Names of the fields this role may change. Everything else the payload carries is
            read-only. Reported by the server so the interface cannot drift from the rule
            the server actually enforces (FR-031, FR-033).
          items: { type: string }
          example: [first_name, last_name, phone, school, jersey_number]

    OwnProfileUpdate:
      type: object
      additionalProperties: false
      description: |
        Every field optional — a partial update. Submitting a field not editable for the
        requester's role is a 422, not a silent no-op (FR-033).

        An omitted key leaves its stored value untouched. A key present with value `null` clears
        the stored value. The empty string is not a way to say "no value" and is rejected with a
        422 naming the field (FR-059). `first_name` and `last_name` may be omitted but may not be
        sent as `null` — both are required.
      properties:
        first_name: { type: string, minLength: 1, maxLength: 100 }
        last_name: { type: string, minLength: 1, maxLength: 100 }
        phone: { type: [string, 'null'], minLength: 1, maxLength: 32 }
        business_name: { type: string, minLength: 1, maxLength: 200 }
        address: { type: [string, 'null'], minLength: 1, maxLength: 500 }
        website: { type: [string, 'null'], minLength: 1, maxLength: 500 }
        description: { type: [string, 'null'], minLength: 1, maxLength: 2000 }
        bio: { type: [string, 'null'], minLength: 1, maxLength: 2000 }
        credentials: { type: [string, 'null'], minLength: 1, maxLength: 1000 }
        certifications: { type: [string, 'null'], minLength: 1, maxLength: 1000 }
        is_publicly_visible: { type: boolean }
        school: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        jersey_number: { type: [string, 'null'], minLength: 1, maxLength: 10 }
        emergency_contact_name: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        emergency_contact_phone: { type: [string, 'null'], minLength: 1, maxLength: 32 }
        emergency_contact_relation: { type: [string, 'null'], minLength: 1, maxLength: 100 }

    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [role, email, first_name, last_name, phone]
      properties:
        role: { $ref: '#/components/schemas/UserRole' }
        email: { type: string, format: email, maxLength: 320 }
        first_name: { type: string, minLength: 1, maxLength: 100 }
        last_name: { type: string, minLength: 1, maxLength: 100 }
        phone:
          type: string
          minLength: 1
          maxLength: 32
          description: |
            Must parse as a real telephone number and is stored normalized to E.164 — the same
            rule the profile save applies (FR-022, data-model.md §12). A 422 attributed to
            `phone` is returned when it does not.
        business_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Required when role is trainer; rejected for any other role (FR-021).

    CreatedUser:
      type: object
      additionalProperties: false
      required: [user, invitation_sent, invitation_expires_at]
      properties:
        user: { $ref: '#/components/schemas/UserDetail' }
        invitation_sent:
          type: boolean
          description: |
            False when the account was created but the email could not be delivered. The
            Super Admin should re-invite (FR-028).
        invitation_expires_at: { type: string, format: date-time }

    UserSummary:
      type: object
      additionalProperties: false
      required: [id, email, first_name, last_name, role, status, created_at, has_password]
      description: One row of the directory (FR-051).
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        created_at: { type: string, format: date-time }
        thumbnail_url: { type: [string, 'null'], description: API-relative; see PhotoUrls. }
        has_password:
          type: boolean
          description: |
            False for an invited account that has not completed setup. Lets the directory
            offer Re-invite on exactly the rows where it applies (FR-053).

    UserDetail:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          additionalProperties: false
          required: [version, phone, role_detail, last_login_at, available_actions]
          properties:
            version:
              type: integer
              description: Echo this on any status change; a mismatch is a 409 (R-10).
            phone: { type: [string, 'null'] }
            photo_url: { type: [string, 'null'], description: API-relative; see PhotoUrls. }
            role_detail: { $ref: '#/components/schemas/RoleDetail' }
            last_login_at: { type: [string, 'null'], format: date-time }
            available_actions:
              type: array
              description: |
                Actions valid for this account's current status, so the directory shows only
                those (FR-053). Advisory for rendering; the server enforces regardless.
              items:
                type: string
                enum: [deactivate, reactivate, erase, reinvite]

    UserPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UserSummary' }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    StatusChangeRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          description: The version observed when the account was read (R-10).

    EraseUserRequest:
      type: object
      additionalProperties: false
      required: [version, reason]
      properties:
        version: { type: integer }
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Retained in the compliance record (FR-044, FR-049).

    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, action, occurred_at]
      properties:
        id: { type: string, format: uuid }
        action:
          type: string
          enum: [user_created, invitation_issued, invitation_consumed, user_deactivated, user_reactivated, user_erased, permission_denied]
        actor:
          type: [object, 'null']
          additionalProperties: false
          required: [id, display_name]
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
        reason: { type: [string, 'null'] }
        detail: { type: [string, 'null'] }
        occurred_at: { type: string, format: date-time }

    AuditPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    ErasureRecord:
      type: object
      additionalProperties: false
      required: [user_id, original_email, original_first_name, original_last_name, erased_by, reason, erased_at]
      properties:
        user_id: { type: string, format: uuid }
        original_email: { type: string }
        original_first_name: { type: string }
        original_last_name: { type: string }
        erased_by:
          type: object
          additionalProperties: false
          required: [id, display_name]
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
        reason: { type: string }
        erased_at: { type: string, format: date-time }

    # -------------------------------------------------------------------------
    # Extension (2026-08-26): ShareLink onboarding, multi-trainer, branding
    # -------------------------------------------------------------------------

    Gender:
      type: string
      enum: [male, female, other, prefer_not_to_say]
      description: Closed set so later epics can group and filter by it (R-32).

    ShareLinkKind:
      type: string
      enum: [player_standing, coach_single_use]
      description: |
        Only `player_standing` is issued by this feature. `coach_single_use` exists in the
        contract so US-01.08 is additive rather than a restructuring (FR-072).

    PortalBranding:
      type: object
      additionalProperties: false
      required: [logo_url, primary_color, updated_at]
      description: |
        One trainer's portal identity. Every value may be absent, and absent means the platform
        default — never an empty string (FR-104, constitution Principle VI).
      properties:
        logo_url:
          type: [string, 'null']
          description: |
            API-relative path under `/media/branding/`. A DOM `src` must prefix the API base
            URL, as with photo URLs. Render through `<img>` only (R-27).
        primary_color:
          type: [string, 'null']
          pattern: '^#[0-9a-f]{6}$'
          description: |
            Exactly the colour the trainer chose (R-29). The readable palette is derived by the
            client; no derived value is stored or transmitted.
        updated_at: { type: [string, 'null'], format: date-time }

    PortalBrandingUpdate:
      type: object
      additionalProperties: false
      description: |
        An omitted key changes nothing; an explicit `null` clears the value to the platform
        default. Empty string is rejected (constitution Principle VI).
      properties:
        primary_color:
          type: [string, 'null']
          pattern: '^#[0-9a-fA-F]{6}$'

    ShareLink:
      type: object
      additionalProperties: false
      required: [id, code, url, kind, is_active, use_count, expires_at, max_uses, created_at]
      description: A trainer's standing player invitation link (FR-065 – FR-069).
      properties:
        id: { type: string, format: uuid }
        code:
          type: string
          minLength: 22
          maxLength: 64
          description: |
            The code as issued. Stored in clear rather than hashed, because FR-069 requires the
            trainer to read it back at any time; R-21 argues why that is safe for this token and
            for no other in the system.
        url:
          type: string
          format: uri
          description: The absolute link, ready to copy — assembled from the configured public base URL.
        kind: { $ref: '#/components/schemas/ShareLinkKind' }
        is_active: { type: boolean }
        use_count:
          type: integer
          description: Raised by exactly one per association produced; a repeat visit raises it by zero (FR-068, FR-082).
        expires_at:
          type: [string, 'null']
          format: date-time
          description: Always null for a standing player link (FR-065).
        max_uses:
          type: [integer, 'null']
          description: Always null for a standing player link.
        created_at: { type: string, format: date-time }

    JoinLinkPreview:
      type: object
      additionalProperties: false
      required: [trainer_display_name, branding, viewer]
      description: |
        The only thing an unauthenticated caller ever learns about a trainer. No identifier, no
        contact detail, no roster size (FR-073).
      properties:
        trainer_display_name:
          type: string
          description: The organization's business name.
        branding: { $ref: '#/components/schemas/PortalBranding' }
        viewer:
          type: object
          additionalProperties: false
          required: [state]
          description: What the join page should offer, decided server-side.
          properties:
            state:
              type: string
              enum: [anonymous, can_join, choose_family_members, already_associated, role_cannot_join, child_must_ask_parent]
              description: |
                `anonymous` → show the registration form. `can_join` → show one confirm button
                (FR-080). `already_associated` → say so and offer the trainer's area (FR-082).
                `role_cannot_join` → explain the link is for players and parents (FR-081).

                Added in 1.2.0: `choose_family_members` → the caller is a parent holding at
                least one child profile, so ask who this trainer is for and post the answer to
                `/join/{code}/accept` (FR-122, Story 13). `child_must_ask_parent` → the caller
                is a signed-in child, so show the "ask your parent" message; the platform has
                already raised the request and emailed the parent (FR-137, FR-138).
            selectable_profiles:
              type: array
              description: |
                Present only for `choose_family_members`. Every live profile on the caller's
                account, each flagged with whether it already trains with this trainer — those
                cannot be selected again and cost the link nothing (FR-082, Story 13 scenario 5).
              items: { $ref: '#/components/schemas/JoinSelectableProfile' }

    JoinRegistrationRequest:
      type: object
      additionalProperties: false
      required: [first_name, last_name, email, password, phone, is_self, gender, date_of_birth]
      description: |
        One account, one player — still. Registration creates the account and its first player
        profile; further children are added afterwards through `POST /me/players` (FR-122), so
        this body carries no list of family members even now that families exist.

        `is_self` was described in 1.1.0 as "the field that keeps that door open". 1.2.0 opens
        it: `is_self` now selects the created profile's `kind` (`self` or `child`), which is the
        same distinction it always encoded (R-34).
      properties:
        first_name: { type: string, minLength: 1, maxLength: 100 }
        last_name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 320 }
        password: { $ref: '#/components/schemas/Password' }
        phone:
          type: string
          minLength: 1
          maxLength: 32
          description: Parseable to E.164, stored normalized — the same rule as every other write path.
        is_self:
          type: boolean
          description: |
            True when the account holder is the player; false when they are registering someone
            they are responsible for. Selects which age band applies (FR-077).
        player_name:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
          description: |
            Required when `is_self` is false. Null when the account holder is the player — the
            name is then read from the profile rather than copied (FR-074).
        date_of_birth:
          type: string
          format: date
          description: |
            The age FR-077 constrains is derived from this: 18 or above when `is_self`, between
            1 and 18 when not. Stored as a date so it does not decay (R-31).
        gender: { $ref: '#/components/schemas/Gender' }

    TrainingContextEntry:
      type: object
      additionalProperties: false
      required: [player_profile_id, player_display_name, player_profile_kind, trainer_id, trainer_display_name, branding, joined_at]
      description: |
        One switchable pair, **replacing `TrainerContextEntry`** (R-49). Names both halves,
        because a parent's switcher groups by profile and a sibling training with the same
        trainer is a different context (FR-117, FR-118).
      properties:
        player_profile_id: { type: string, format: uuid }
        player_display_name:
          type: string
          description: |
            The child's own name, or the account holder's name for a `self` profile — the
            platform resolves which source applies (R-37), so the client never chooses.
        player_profile_kind: { $ref: '#/components/schemas/PlayerProfileKind' }
        trainer_id: { type: string, format: uuid }
        trainer_display_name: { type: string }
        branding: { $ref: '#/components/schemas/PortalBranding' }
        joined_at: { type: string, format: date-time }

    TrainingContextList:
      type: object
      additionalProperties: false
      required: [active_player_profile_id, active_trainer_id, contexts]
      description: |
        The switcher's whole state, **replacing `TrainerContextList`** (R-49). `contexts` holds
        only Active associations with Active trainers on live profiles, so every entry is
        switchable (FR-089, FR-120). One entry means no switcher is shown (FR-118, FR-119); an
        empty list means the person belongs to no trainer, which is valid.

        For a signed-in child every entry carries the same `player_profile_id` — their own — and
        no sibling appears (FR-119, FR-132).
      properties:
        active_player_profile_id:
          type: [string, 'null']
          format: uuid
          description: Null only when `contexts` is empty; always set together with `active_trainer_id`.
        active_trainer_id:
          type: [string, 'null']
          format: uuid
          description: Null only when `contexts` is empty.
        contexts:
          type: array
          items: { $ref: '#/components/schemas/TrainingContextEntry' }

    TrainingContextRequest:
      type: object
      additionalProperties: false
      required: [player_profile_id, trainer_id]
      description: |
        Both halves are required — a trainer alone no longer identifies a context (FR-117). The
        trainer is named here rather than in the path, which is what keeps context
        server-resolved everywhere else (R-25, R-48).
      properties:
        player_profile_id: { type: string, format: uuid }
        trainer_id: { type: string, format: uuid }

    JoinSelectableProfile:
      type: object
      additionalProperties: false
      required: [player_profile_id, display_name, kind, already_associated]
      description: |
        One family member offered on the "who will train with this trainer?" question
        (FR-122, Story 13).
      properties:
        player_profile_id: { type: string, format: uuid }
        display_name: { type: string }
        kind: { $ref: '#/components/schemas/PlayerProfileKind' }
        already_associated:
          type: boolean
          description: |
            True when this profile already trains with the link's trainer. Shown as connected
            and not selectable; selecting it would cost the link a use for nothing (FR-082).

    JoinAcceptRequest:
      type: object
      additionalProperties: false
      description: |
        Added in 1.2.0. Which family members join the link's trainer (FR-122, Story 13).

        Omit `player_profile_ids` entirely — or send it empty — and nothing is associated and
        nothing changes (Story 13 scenario 3). An account holding exactly one profile may omit
        it and that profile is used, which keeps the 1.1.0 behaviour for a person with no
        children (Story 13 scenario 4).
      properties:
        player_profile_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            Each must be a live profile on the caller's account. A profile already associated
            with this trainer is ignored rather than refused, and does not raise the link's use
            count (FR-082).

    JoinResult:
      type: object
      additionalProperties: false
      required: [trainer_id, trainer_display_name, associated_profile_ids, already_associated_profile_ids, active_player_profile_id, active_trainer_id]
      description: |
        **Changed in 1.2.0**: a single join may now associate several family members, so the
        result reports sets rather than one boolean (Story 13).
      properties:
        trainer_id: { type: string, format: uuid }
        trainer_display_name: { type: string }
        associated_profile_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            The profiles newly associated by this call. The link's use count rose by exactly
            this many (FR-068, SC-019).
        already_associated_profile_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            Profiles that were already connected. Nothing was written for them and the use
            count did not move (FR-082).
        active_player_profile_id:
          type: [string, 'null']
          format: uuid
          description: |
            The context the caller is now in. The account holder's profile when it was among
            those selected, otherwise the first selected child (Story 13 scenario 6). Null when
            nothing was selected.
        active_trainer_id:
          type: [string, 'null']
          format: uuid
          description: The link's trainer, or null when nothing was selected.

    TrainerPlayerSummary:
      type: object
      additionalProperties: false
      required: [player_profile_id, display_name, kind, joined_at, photo_url, responsible_contact]
      description: |
        One row of a trainer's roster. Deliberately carries nothing about the player's other
        trainers — not an identifier, not a count (FR-090, SC-025) — and nothing about any other
        profile on the same account (FR-116, SC-040).

        **Changed in 1.2.0**: names a player profile rather than an account (`player_user_id` is
        gone), and carries the responsible adult's contact detail, because a trainer with a
        child on their roster must be able to reach the parent (FR-116).
      properties:
        player_profile_id: { type: string, format: uuid }
        display_name:
          type: string
          description: The player's name, or "Deleted User" once erased (FR-091, FR-116).
        kind: { $ref: '#/components/schemas/PlayerProfileKind' }
        age:
          type: [integer, 'null']
          description: Derived from the stored date of birth; null once erased (R-31).
        gender: { type: [string, 'null'] }
        joined_at: { type: string, format: date-time }
        photo_url: { type: [string, 'null'] }
        responsible_contact:
          $ref: '#/components/schemas/ResponsibleContact'
          description: |
            The account responsible for this player. For a `self` profile that is the player
            themselves; for a `child` it is the parent (FR-113, FR-116).

    ResponsibleContact:
      type: object
      additionalProperties: false
      required: [display_name, email, phone]
      description: |
        The adult a trainer contacts about a player. Never carries the responsible account's
        identifier, so a roster row cannot be used to correlate siblings across two trainers'
        rosters (FR-116, SC-040).
      properties:
        display_name: { type: string }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }

    TrainerPlayerPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TrainerPlayerSummary' }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    # -------------------------------------------------------------------------
    # Extension (2026-08-27): family accounts, child sign-in, approvals
    # -------------------------------------------------------------------------

    PlayerProfileKind:
      type: string
      enum: [self, child]
      description: |
        `self` — the account holder is this player; at most one per account, and its name and
        photo are the account's (R-37). `child` — a player the account holder is responsible
        for; any number per account, carrying its own name and photo.

    PlayerProfileAssociation:
      type: object
      additionalProperties: false
      required: [association_id, trainer_id, trainer_display_name, joined_at]
      description: |
        One trainer a player profile trains with, as the family sees it (FR-124). Addressed for
        removal by `association_id` (R-48).
      properties:
        association_id: { type: string, format: uuid }
        trainer_id: { type: string, format: uuid }
        trainer_display_name: { type: string }
        joined_at: { type: string, format: date-time }

    PlayerProfile:
      type: object
      additionalProperties: false
      required: [id, kind, display_name, photo_url, tokens_without_approval, has_sign_in, associations]
      description: |
        One player on the account (FR-106, FR-107). Replaces the per-player fields that
        `PlayerParentDetail` carried before 1.2.0 (R-34).
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/PlayerProfileKind' }
        display_name:
          type: string
          description: |
            Resolved by the platform: the child's own name, or the account holder's name for a
            `self` profile. The client never chooses the source (R-37).
        first_name:
          type: [string, 'null']
          maxLength: 100
          description: Null for a `self` profile, where the name is the account's (R-37).
        last_name: { type: [string, 'null'], maxLength: 100 }
        date_of_birth: { type: [string, 'null'], format: date }
        age:
          type: [integer, 'null']
          readOnly: true
          description: Derived from `date_of_birth`, never stored (R-31).
        gender: { type: [string, 'null'] }
        school: { type: [string, 'null'], maxLength: 200 }
        jersey_number: { type: [string, 'null'], maxLength: 10 }
        skill_level:
          type: [string, 'null']
          readOnly: true
          description: Assigned by a trainer in a later feature. Never writable by the family (FR-107).
        photo_url:
          type: [string, 'null']
          description: API-relative; see PhotoUrls. Null renders the default avatar.
        tokens_without_approval:
          type: boolean
          description: |
            Whether this child may spend tokens without asking. Defaults to false — approval
            required — and only the parent may change it (FR-146, FR-147, R-44). Always false
            and unwritable on a `self` profile, which needs nobody's approval.
        has_sign_in:
          type: boolean
          description: |
            Whether this child holds their own sign-in (FR-129). The email itself is not
            returned here; read it from `ChildSignIn` when granting.
        associations:
          type: array
          description: The trainers this profile currently trains with (FR-124).
          items: { $ref: '#/components/schemas/PlayerProfileAssociation' }

    PlayerProfileList:
      type: object
      additionalProperties: false
      required: [profiles]
      description: |
        Every live profile on the account. Not paged — a family is small, and FR-124 asks for
        the whole list on one page. A signed-in child receives exactly one entry (FR-132).
      properties:
        profiles:
          type: array
          items: { $ref: '#/components/schemas/PlayerProfile' }

    CreateChildProfileRequest:
      type: object
      additionalProperties: false
      required: [first_name, last_name, date_of_birth, gender]
      description: |
        Creates a `child` profile (FR-107). `kind` is not a field — this endpoint creates
        children only, and the account holder's own profile is created at registration.
      properties:
        first_name: { type: string, minLength: 1, maxLength: 100 }
        last_name: { type: string, minLength: 1, maxLength: 100 }
        date_of_birth:
          type: string
          format: date
          description: |
            A real past date whose derived age is between 1 and 18. An adult's date is a 422 on
            this field — adults hold their own accounts (FR-108, Story 9 scenario 9).
        gender: { $ref: '#/components/schemas/Gender' }
        school: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        jersey_number: { type: [string, 'null'], minLength: 1, maxLength: 10 }
        trainer_ids:
          type: array
          description: |
            The trainers this child will train with, as answered to FR-122's question. Each must
            be one the caller's account already trains with. Omitted or empty creates the
            profile with no association, which is valid (FR-123).
          items: { type: string, format: uuid }
        acknowledge_possible_duplicate:
          type: boolean
          default: false
          description: |
            Set true to create the profile despite a 409 duplicate warning. Twins and a child
            named for a parent are ordinary, so the warning is overrulable (FR-110, R-45).

    PlayerProfileUpdate:
      type: object
      additionalProperties: false
      description: |
        Every field optional — a partial update. An omitted key leaves its stored value
        untouched. A key present with value `null` clears the stored value. The empty string is
        not a way to say "no value" and is rejected with a 422 naming the field (FR-059).

        `first_name` and `last_name` may be omitted but may not be sent as `null` on a `child`
        profile — both are required there — and may not be sent at all on a `self` profile,
        where the name belongs to the account (R-37).

        `tokens_without_approval` is writable only by the parent; a child sending it receives a
        403 rather than a silent no-op (FR-132, FR-147).
      properties:
        first_name: { type: string, minLength: 1, maxLength: 100 }
        last_name: { type: string, minLength: 1, maxLength: 100 }
        date_of_birth: { type: string, format: date }
        gender: { $ref: '#/components/schemas/Gender' }
        school: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        jersey_number: { type: [string, 'null'], minLength: 1, maxLength: 10 }
        tokens_without_approval: { type: boolean }

    DuplicateProfileError:
      type: object
      additionalProperties: false
      required: [error]
      description: |
        The 409 a near-duplicate child produces, carrying what matched so the parent can see
        whether they meant it (FR-110, R-45).
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, matches]
          properties:
            code: { type: string, enum: [possible_duplicate_profile] }
            message: { type: string }
            matches:
              type: array
              description: The existing profiles that matched on name and date of birth.
              items: { $ref: '#/components/schemas/PlayerProfile' }

    AddPlayerTrainerRequest:
      type: object
      additionalProperties: false
      description: |
        Exactly one of `code` or `trainer_id` must be present — FR-125's two ways in. Supplying
        both, or neither, is a 422.
      properties:
        code:
          type: [string, 'null']
          minLength: 8
          maxLength: 64
          description: A trainer's invitation link code, validated exactly as any other use of it (FR-070).
        trainer_id:
          type: [string, 'null']
          format: uuid
          description: |
            A trainer the caller's account already trains with through some profile. Named in
            the body rather than the path, so context stays server-resolved (R-25, R-48).

    GrantChildSignInRequest:
      type: object
      additionalProperties: false
      required: [email]
      description: |
        The email that becomes this child's login (FR-129). Subject to the platform-wide
        uniqueness rule across every status, so the parent's own address is refused rather than
        shared (FR-004).
      properties:
        email: { type: string, format: email, maxLength: 320 }

    ChildSignIn:
      type: object
      additionalProperties: false
      required: [player_profile_id, email, invitation_sent]
      properties:
        player_profile_id: { type: string, format: uuid }
        email: { type: string, format: email }
        invitation_sent:
          type: boolean
          description: |
            False when the setup invitation could not be delivered. A failed delivery is never
            reported as success; re-grant to try again (FR-064).

    ApprovalRequestKind:
      type: string
      enum: [join_trainer, usd_payment, token_spend]
      description: |
        `join_trainer` is the only kind this feature creates and carries out — its subject
        exists today (FR-138). `usd_payment` and `token_spend` have their rules and their
        recorded shape here, and their execution belongs to Epic-05; approving either is refused
        while no executor is registered (FR-142, R-46).

    ApprovalRequestStatus:
      type: string
      enum: [pending_parent_approval, info_requested, approved, denied, expired, withdrawn]
      description: |
        `pending_parent_approval` and `info_requested` are live; the other four are terminal
        (FR-143). Only `approved` permits the requested action to happen, and it happens exactly
        once (FR-144). `expired` is distinguished from `denied` so a parent who never saw a
        request is distinguishable in the record from one who considered it and said no (R-43).

    ApprovalRequest:
      type: object
      additionalProperties: false
      required: [id, player_profile_id, player_display_name, kind, status, requested_at, expires_at]
      description: |
        One thing a child asked for and a parent must decide (FR-141). The subject fields
        present depend on `kind`: a `join_trainer` request names a trainer; a financial request
        carries an amount and currency.
      properties:
        id: { type: string, format: uuid }
        player_profile_id: { type: string, format: uuid }
        player_display_name:
          type: string
          description: The child this request is about, so the parent's queue reads without a second call.
        kind: { $ref: '#/components/schemas/ApprovalRequestKind' }
        status: { $ref: '#/components/schemas/ApprovalRequestStatus' }
        trainer_id: { type: [string, 'null'], format: uuid }
        trainer_display_name:
          type: [string, 'null']
          description: Present for a `join_trainer` request — what the child is asking to join.
        amount_minor:
          type: [integer, 'null']
          description: |
            Minor currency units — an integer, never a float (R-39). This is the amount the
            parent was shown; approving at a different figure is refused (FR-152).
        currency: { type: [string, 'null'], minLength: 3, maxLength: 3 }
        requested_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: |
            48 hours after `requested_at`, written once and never recomputed — asking the child
            for information does not restart it (FR-155, R-43). The interface derives the time
            remaining from this.
        parent_note: { type: [string, 'null'], maxLength: 1000 }
        child_note: { type: [string, 'null'], maxLength: 1000 }
        resolved_at: { type: [string, 'null'], format: date-time }
        resolved_by:
          type: [string, 'null']
          enum: [parent, child, super_admin, null]
          description: |
            Who resolved it. Null for an expiry, which nobody performed — the one resolution
            with no actor (R-43).

    ApprovalRequestPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApprovalRequest' }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    ApprovalDecisionRequest:
      type: object
      additionalProperties: false
      description: |
        An optional note the parent may attach to an approval or a denial (FR-150). Delivered to
        the child on a denial (FR-153).
      properties:
        note: { type: [string, 'null'], minLength: 1, maxLength: 1000 }

    ApprovalInfoRequest:
      type: object
      additionalProperties: false
      required: [note]
      description: |
        The note is required here: asking for more information without saying what is wanted, or
        replying without saying anything, is not a message (FR-150, FR-153).
      properties:
        note: { type: string, minLength: 1, maxLength: 1000 }
