openapi: 3.1.0
info:
  title: PracticePerfect — User Roles, Authorization & Super Admin User Management
  version: 1.1.0
  description: |
    Contract for feature 001-user-roles-admin. Covers sign-in and session handling,
    invitation-driven first password setup, self-service profile editing for all four roles,
    and the Super Admin user directory with create, deactivate, reactivate, and erase.

    Version 1.1.0 adds the 2026-08-26 extension: the ShareLink invitation system players join
    through, the multi-trainer association and server-resolved trainer context it requires, and
    trainer portal branding. Those operations are grouped in the `join`, `trainer`, and `media`
    tags and under `/me/share-link`, `/me/trainers`, `/me/trainer-context`, and `/me/branding`.

    Authentication is a session cookie (see securitySchemes). Every response body is a
    Pydantic V2 model; no endpoint ever returns a database error, driver message, or stack
    trace (FR-056).

    Traceability: each operation carries `x-requirements` listing the spec requirements it
    satisfies.
servers:
  - url: /api/v1
    description: Versioned API root

tags:
  - name: auth
    description: Sign-in, sign-out, session inspection, first-password setup
  - name: me
    description: Self-service profile for the signed-in account
  - name: admin-users
    description: Super Admin user directory and lifecycle actions
  - name: media
    description: Delivery of stored profile photos (authenticated) and portal logos (public)
  - name: join
    description: Public invitation-link preview, registration, and association
  - name: trainer
    description: A trainer's own organization — currently their player roster

security:
  - sessionCookie: []

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Sign in with email and password
      operationId: login
      security: []
      x-requirements: [FR-008, FR-009, FR-010, FR-011, FR-013, FR-026]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: |
            Signed in. Sets the session cookie and returns the current account summary.
          headers:
            Set-Cookie:
              description: 'pp_session=<opaque token>; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=604800'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401':
          description: |
            Credentials rejected. Returned identically for an unknown email, a wrong password,
            and an account that has no password set yet, so the response cannot be used to
            discover which emails are registered (FR-010).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: invalid_credentials
                  message: Email or password is incorrect.
        '403':
          description: |
            Credentials were correct but the account is not Active. Deliberately distinct from
            401, because FR-010 requires this case to say so (FR-010, second clause).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: account_not_active
                  message: Account deactivated. Contact support.
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      tags: [auth]
      summary: End the current session
      operationId: logout
      x-requirements: [FR-011]
      responses:
        '204':
          description: Session revoked and cookie cleared. Idempotent.
          headers:
            Set-Cookie:
              description: 'pp_session=; Max-Age=0'
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/session:
    get:
      tags: [auth]
      summary: Describe the current session's account
      operationId: getCurrentSession
      x-requirements: [FR-018, FR-019]
      description: |
        The frontend calls this on load to decide what to render. Advances the session's
        last-activity time, so it participates in the sliding inactivity window.
      responses:
        '200':
          description: The signed-in account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/setup-password/{token}:
    get:
      tags: [auth]
      summary: Check whether a setup link is still usable
      operationId: checkSetupInvitation
      security: []
      x-requirements: [FR-027]
      description: |
        Lets the set-password page show "this link has expired, request a new one" before the
        person types a password. Returns only whether the link is usable and the masked email
        it belongs to — never the account identifier or role.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      responses:
        '200':
          description: Link is usable.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [email_hint, expires_at]
                properties:
                  email_hint:
                    type: string
                    description: Partially masked address, e.g. 'a**@example.org'.
                    example: a**@example.org
                  expires_at: { type: string, format: date-time }
        '410':
          description: Link is consumed, expired, superseded, or its account is not Active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: invitation_not_usable
                  message: This setup link is no longer valid. Request a new one.

  /auth/setup-password:
    post:
      tags: [auth]
      summary: Set the first password using a setup link
      operationId: setupPassword
      security: []
      x-requirements: [FR-014, FR-026, FR-027]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, minLength: 32, maxLength: 128 }
                password: { $ref: '#/components/schemas/Password' }
      responses:
        '204':
          description: |
            Password set and the invitation consumed. No session is issued — the person signs
            in normally, which proves the credential works.
        '410':
          description: Link is consumed, expired, superseded, or its account is not Active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            Password rejected by policy — too short, or present in the breached-password list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                error:
                  code: validation_failed
                  message: One or more fields are invalid.
                  fields:
                    - field: password
                      message: Password must be at least 12 characters.

  /me/profile:
    get:
      tags: [me]
      summary: Read the signed-in account's own profile
      operationId: getOwnProfile
      x-requirements: [FR-017, FR-031]
      responses:
        '200':
          description: |
            The profile, including the role-specific block. `editable` and `read_only` are
            reported explicitly so the interface never has to hardcode which is which
            (FR-031, FR-033).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [me]
      summary: Update the signed-in account's own profile
      operationId: updateOwnProfile
      x-requirements: [FR-017, FR-032, FR-033, FR-036]
      description: |
        Accepts only the fields editable for the requester's role. Submitting `email`, `role`,
        `status`, `created_at`, or `skill_level` is rejected with 422 rather than silently
        ignored, so a mistaken client learns of its error (FR-033).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnProfileUpdate' }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: The account is Deleted and cannot be edited (FR-048).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/profile/photo:
    put:
      tags: [me]
      summary: Upload or replace the signed-in account's photo
      operationId: uploadOwnPhoto
      x-requirements: [FR-034]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG, or WebP, at most 5 MB.
      responses:
        '200':
          description: |
            Stored. Returns both URLs. Any previously stored original and thumbnail are deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoUrls' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '413':
          description: File exceeds 5 MB. The existing photo is unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: |
            Not a decodable JPEG, PNG, or WebP. Determined by decoding the bytes, not by the
            declared content type or the filename. The existing photo is unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: unsupported_image
                  message: Upload a JPEG, PNG, or WebP image no larger than 5 MB.
    delete:
      tags: [me]
      summary: Remove the signed-in account's photo
      operationId: deleteOwnPhoto
      x-requirements: [FR-035]
      responses:
        '204':
          description: Removed; the default avatar now applies. Idempotent.
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /media/photos/{key}:
    get:
      tags: [media]
      summary: Fetch a stored profile photo
      operationId: getPhoto
      x-requirements: [FR-034, FR-035]
      description: |
        Served through the application rather than a static mount so that the session check
        lives in one place and the storage layout stays private.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
        - name: variant
          in: query
          required: false
          schema:
            type: string
            enum: [original, thumb]
            default: original
      responses:
        '200':
          description: The image bytes.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users:
    get:
      tags: [admin-users]
      summary: Browse the platform-wide user directory
      operationId: listUsers
      x-requirements: [FR-016, FR-051, FR-052, SC-006]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: q
          in: query
          description: Case-insensitive partial match on name or email.
          schema: { type: string, maxLength: 200 }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/UserRole' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AccountStatus' }
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at_desc, created_at_asc, name_asc, name_desc]
            default: created_at_desc
      responses:
        '200':
          description: One page of the directory.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-users]
      summary: Create an account and send its setup invitation
      operationId: createUser
      x-requirements: [FR-021, FR-022, FR-023, FR-024, FR-025, FR-029, FR-030]
      description: |
        Creates the account with status Active and no password, creates the profile and the
        role detail row matching the role, writes the audit entry, and sends the invitation —
        all in one transaction, so a failure leaves no partial account behind (FR-024).

        `business_name` is required when `role` is `trainer` and rejected for other roles.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: |
            Created and invited. `invitation_sent` reports whether delivery succeeded; when
            false, the account still exists and the Super Admin should re-invite (FR-028).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The email already belongs to an account in any status (FR-004, FR-023).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: email_already_registered
                  message: An account with this email address already exists.
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [admin-users]
      summary: Read one account in full
      operationId: getUser
      x-requirements: [FR-016, FR-017, FR-051]
      responses:
        '200':
          description: |
            The account with its profile and role detail. Includes `version`, which the caller
            must echo on any subsequent status change (FR-010 concurrency, R-10).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{user_id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [admin-users]
      summary: Deactivate an account
      operationId: deactivateUser
      x-requirements: [FR-037, FR-038, FR-041, FR-042, FR-012, SC-007]
      description: |
        Moves an Active account to Inactive, revoking every session it holds in the same
        transaction. Refused when the target is the caller, or the last Active Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusChangeRequest' }
      responses:
        '200':
          description: Deactivated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StatusConflict' }
        '422':
          description: |
            The action is not permitted for this target: the account is not Active, it is the
            caller's own account, or it is the last Active Super Admin (FR-041).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                lastSuperAdmin:
                  value:
                    error:
                      code: last_super_admin
                      message: This is the only active Super Admin and cannot be deactivated.
                selfAction:
                  value:
                    error:
                      code: self_action_forbidden
                      message: You cannot deactivate your own account.

  /admin/users/{user_id}/reactivate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [admin-users]
      summary: Reactivate an inactive account
      operationId: reactivateUser
      x-requirements: [FR-040, FR-042]
      description: |
        Returns an Inactive account to Active with its existing password and profile intact.
        Refused for a Deleted account, because erasure is terminal (FR-048).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusChangeRequest' }
      responses:
        '200':
          description: Reactivated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StatusConflict' }
        '422':
          description: The account is not Inactive, or it is Deleted and cannot be restored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: erasure_is_permanent
                  message: This account was erased and cannot be reactivated.

  /admin/users/{user_id}/erase:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [admin-users]
      summary: Permanently erase an account's personal information
      operationId: eraseUser
      x-requirements: [FR-043, FR-044, FR-045, FR-046, FR-047, FR-048, FR-049, FR-041]
      description: |
        Irreversible. Anonymizes the account in place, revokes its sessions, supersedes any
        unconsumed invitation, deletes its stored photo files, and writes the compliance
        record — one transaction. Every historical record referencing the account survives
        untouched, so reporting totals do not move (FR-046, FR-047).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EraseUserRequest' }
      responses:
        '200':
          description: Erased. The returned account already shows its anonymized values.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StatusConflict' }
        '422':
          description: |
            Already Deleted, the caller's own account, or the last Active Super Admin
            (FR-041, FR-048).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/users/{user_id}/reinvite:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [admin-users]
      summary: Issue a fresh setup invitation
      operationId: reinviteUser
      x-requirements: [FR-028]
      description: |
        Valid only for an Active account that has never set a password. Supersedes any
        outstanding invitation, so exactly one link is live at a time.
      responses:
        '200':
          description: A new invitation was issued.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [invitation_sent, expires_at]
                properties:
                  invitation_sent: { type: boolean }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The account already has a password, or is not Active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/users/{user_id}/audit:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [admin-users]
      summary: Read the audit trail for one account
      operationId: listUserAudit
      x-requirements: [FR-054, FR-055]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Audit entries where this account is the target, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/erasure-records/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [admin-users]
      summary: Read the compliance record for an erased account
      operationId: getErasureRecord
      x-requirements: [FR-049]
      description: |
        The only route that exposes an erased account's original identity. Super Admin only,
        and never joined into any account view.
      responses:
        '200':
          description: The compliance record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErasureRecord' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No erasure record exists for this account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------------------
  # Extension (2026-08-26): ShareLink onboarding, multi-trainer context, branding
  # ---------------------------------------------------------------------------

  /join/{code}:
    parameters:
      - $ref: '#/components/parameters/ShareLinkCode'
    get:
      tags: [join]
      summary: Preview the trainer behind an invitation link
      operationId: previewJoinLink
      security: []
      x-requirements: [FR-070, FR-071, FR-073]
      description: |
        Public and unauthenticated — this is the first thing a flyer's reader reaches. Returns
        only what the join page must show: the trainer's business name and branding.

        Every refusal reason — unknown code, revoked, expired, exhausted, trainer not Active —
        returns the same 404 with the same message and no trainer detail, so the endpoint
        cannot be used to enumerate codes or confirm a trainer exists (FR-070).

        Throttled per origin: 10 unsuccessful lookups in 15 minutes and further lookups are
        refused, sliding (FR-071, R-30).
      responses:
        '200':
          description: The link is usable. Render the join page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinLinkPreview' }
        '404':
          description: The link is not valid. One message for every cause (FR-070).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: invitation_link_invalid
                  message: This link is no longer valid.
        '429': { $ref: '#/components/responses/LookupThrottled' }

  /join/{code}/register:
    parameters:
      - $ref: '#/components/parameters/ShareLinkCode'
    post:
      tags: [join]
      summary: Register a new player account and join the trainer
      operationId: registerThroughJoinLink
      security: []
      x-requirements: [FR-074, FR-075, FR-076, FR-077, FR-078, FR-079, FR-083]
      description: |
        Creates the account, its profile, its player detail and parent contact rows, the
        association with the link's trainer, and a session — in **one** transaction. A failure
        at any point leaves nothing behind (FR-083, R-23).

        On success the response sets the session cookie, so the person is signed in without a
        second step (FR-078), and `active_trainer_id` is the link's trainer.

        `date_of_birth` rather than an age: the age FR-077 constrains is derived from it, so
        the stored value does not decay (R-31). When `is_self` is true the derived age must be
        18 or above; when false it must be between 1 and 18.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinRegistrationRequest' }
      responses:
        '201':
          description: Account created, joined, and signed in. Sets the session cookie.
          headers:
            Set-Cookie:
              description: Session cookie, as on sign-in (FR-011).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinResult' }
        '404':
          description: The link is not valid (FR-070).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The email already belongs to an account in any status (FR-076).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: email_already_registered
                  message: An account with this email already exists. Sign in, then open the link again.
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/LookupThrottled' }

  /join/{code}/accept:
    parameters:
      - $ref: '#/components/parameters/ShareLinkCode'
    post:
      tags: [join]
      summary: Join the trainer as an already signed-in player
      operationId: acceptJoinLink
      x-requirements: [FR-080, FR-081, FR-082, FR-084, FR-085]
      description: |
        No body and no detail to supply: the account already exists (FR-080). Creates the
        association and switches the caller's active context to the new trainer.

        Repeating the call for a trainer already joined returns 200 with
        `already_associated: true`, creates nothing, and does **not** raise the link's use
        count (FR-082).

        A caller whose role is not `player_parent` is refused and nothing is written (FR-081).
      responses:
        '200':
          description: Associated, or already associated. The active context is the link's trainer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: The caller's role cannot join through a player link (FR-081).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: role_cannot_join
                  message: This link is for players and parents.
        '404':
          description: The link is not valid (FR-070).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/LookupThrottled' }

  /me/share-link:
    get:
      tags: [me]
      summary: Read this trainer's standing player invitation link
      operationId: getOwnShareLink
      x-requirements: [FR-065, FR-067, FR-069]
      description: |
        Trainer only. A pure read — the link was created with the account (R-22), so this
        endpoint never writes. `url` is absolute and ready to copy onto a flyer; `code` is
        given separately for clients that build their own display.
      responses:
        '200':
          description: The trainer's current standing link, with its usage counters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareLink' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/share-link/regenerate:
    post:
      tags: [me]
      summary: Replace this trainer's invitation link with a fresh one
      operationId: regenerateOwnShareLink
      x-requirements: [FR-069]
      description: |
        Revokes the current code and issues a new one in the same transaction. The old code
        stops admitting anyone immediately (SC-020); every association it already produced is
        untouched, which is why the old row is retained rather than deleted.
      responses:
        '201':
          description: The new link. The previous code is dead from this moment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareLink' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/trainers:
    get:
      tags: [me]
      summary: List the trainers this player trains with
      operationId: listOwnTrainers
      x-requirements: [FR-084, FR-088, FR-089]
      description: |
        Player/Parent only. Backs the context switcher. Returns only Active associations whose
        trainer account is Active (FR-089); an entry is therefore always switchable. When the
        list holds one entry the interface shows no switcher (FR-088); when it is empty the
        person belongs to no trainer, which is a valid state.
      responses:
        '200':
          description: The caller's trainers, and which one is active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainerContextList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/trainer-context:
    put:
      tags: [me]
      summary: Switch which trainer this player is looking at
      operationId: switchTrainerContext
      x-requirements: [FR-086, FR-087, FR-088, FR-090]
      description: |
        The only way context changes. No other endpoint accepts a trainer identifier, because
        context is a data-isolation boundary rather than a view preference (R-25).

        A trainer the caller holds no Active association with returns **404, not 403** — a
        refusal that distinguished "not yours" from "does not exist" would confirm the
        existence of trainers the caller cannot see (FR-090).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainerContextRequest' }
      responses:
        '200':
          description: |
            The new active context. The client discards every cached context-scoped response
            before rendering (R-26).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainerContextList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No Active association with that trainer, or no such trainer (FR-090).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/branding:
    get:
      tags: [me]
      summary: Read this trainer's portal branding
      operationId: getOwnBranding
      x-requirements: [FR-093, FR-104]
      description: Trainer only. Absent values mean the platform default, never an empty string.
      responses:
        '200':
          description: The trainer's stored branding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalBranding' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [me]
      summary: Set or clear the primary brand colour
      operationId: updateOwnBranding
      x-requirements: [FR-093, FR-098, FR-102, FR-104]
      description: |
        An omitted key leaves the colour unchanged; an explicit `null` clears it back to the
        platform default (constitution Principle VI). The colour is stored exactly as chosen —
        the readable palette is derived at render time, so no derived value is persisted (R-29).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalBrandingUpdate' }
      responses:
        '200':
          description: The stored branding after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalBranding' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /me/branding/logo:
    put:
      tags: [me]
      summary: Upload this trainer's portal logo
      operationId: uploadOwnLogo
      x-requirements: [FR-094, FR-095, FR-096, FR-103]
      description: |
        Trainer only. PNG, JPEG, or SVG, at most 2 MB.

        Raster uploads are decode-validated and, above 200×200, fitted to it preserving aspect
        ratio rather than refused (FR-096). SVG uploads are screened before storage — DOCTYPE
        refused, then scripts, `foreignObject`, `on*` attributes, and non-fragment references
        rejected (FR-095, R-27) — and are not resized, because they scale.

        Replacing a logo removes the previous file (FR-103).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: The stored branding, with the new logo URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalBranding' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: Over 2 MB (FR-094).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            Not a PNG, JPEG, or SVG; declared type does not match the decoded content; or the
            SVG failed screening (FR-094, FR-095).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
    delete:
      tags: [me]
      summary: Remove this trainer's portal logo
      operationId: deleteOwnLogo
      x-requirements: [FR-100, FR-103]
      responses:
        '204':
          description: Logo cleared and its file removed. The platform default renders.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/branding/reset:
    post:
      tags: [me]
      summary: Reset branding to the platform default
      operationId: resetOwnBranding
      x-requirements: [FR-100, FR-103]
      description: Clears logo and colour together and removes the stored logo file.
      responses:
        '200':
          description: Branding after the reset — every value absent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalBranding' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /media/branding/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string, maxLength: 128 }
    get:
      tags: [media]
      summary: Fetch a stored portal logo
      operationId: getBrandingLogo
      security: []
      x-requirements: [FR-073, FR-095, FR-101]
      description: |
        **Unauthenticated**, unlike `/media/photos/{key}`, because FR-073 requires the join
        page to show a trainer's branding before anyone has an account. A logo is published
        material; a profile photo is not.

        SVG responses carry `X-Content-Type-Options: nosniff` and
        `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'`. Clients must
        render logos through `<img>` only — never `<object>`, `<embed>`, or inline (R-27).
      responses:
        '200':
          description: The image.
          headers:
            Cache-Control:
              schema: { type: string, example: 'public, max-age=300' }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
            Content-Security-Policy:
              description: Sent for SVG responses.
              schema: { type: string }
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/svg+xml:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /trainer/players:
    get:
      tags: [trainer]
      summary: List the players associated with this trainer
      operationId: listTrainerPlayers
      x-requirements: [FR-090, FR-091, SC-025]
      description: |
        Trainer only, and scoped to the caller's own associations — there is no parameter that
        could widen it.

        Nothing in the response says whether a player also trains with another trainer: no
        other-trainer identifier, no count of trainers, no join date from elsewhere (FR-090,
        SC-025).

        An erased player appears here as "Deleted User" with the association intact, which is
        what keeps participant counts stable (FR-091, SC-008).
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: q
          in: query
          description: Case-insensitive partial match on the player's name.
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: One page of this trainer's roster.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainerPlayerPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: pp_session
      description: |
        Opaque server-side session token. HttpOnly, Secure, SameSite=Lax. Sliding 7-day
        inactivity expiry. Revoked on sign-out and the moment the account leaves Active
        status (FR-011, FR-012).

  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShareLinkCode:
      name: code
      in: path
      required: true
      description: The invitation link's code, exactly as issued (R-21).
      schema: { type: string, minLength: 8, maxLength: 64 }

  responses:
    Unauthenticated:
      description: No valid session, or the session's account is no longer Active (FR-018).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: not_authenticated
              message: Sign in to continue.
    Forbidden:
      description: |
        The session is valid but the role may not perform this action. Recorded as a
        `permission_denied` audit entry (FR-020).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: forbidden
              message: Your role does not permit this action.
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: |
        One or more fields failed validation. Every offending field is listed, so the
        interface can mark each one rather than showing a single generic failure (FR-022).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    RateLimited:
      description: |
        Too many failed sign-in attempts for this email or from this address. Retry after the
        stated interval; access resumes automatically (FR-013, SC-011).
      headers:
        Retry-After:
          description: Seconds until attempts are accepted again.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: too_many_attempts
              message: Too many attempts. Try again in a few minutes.
    LookupThrottled:
      description: |
        Too many unsuccessful invitation-code lookups from this origin. Retry after the stated
        interval; access resumes automatically (FR-071, SC-021, R-30).
      headers:
        Retry-After:
          description: Seconds until lookups are accepted again.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: too_many_attempts
              message: Too many attempts. Try again in a few minutes.

    StatusConflict:
      description: |
        The account changed since it was read. The caller's `version` did not match. Re-read
        and retry (R-10).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: stale_version
              message: This account was changed by someone else. Reload and try again.

  schemas:
    UserRole:
      type: string
      enum: [super_admin, trainer, coach, player_parent]

    AccountStatus:
      type: string
      enum: [active, inactive, deleted]

    Password:
      type: string
      minLength: 12
      maxLength: 128
      format: password
      description: At least 12 characters and not present in the breached-password list (FR-014).

    Error:
      type: object
      additionalProperties: false
      required: [error]
      description: |
        The single error envelope for every failure. Carries a stable machine-readable `code`
        and a message safe to show a user. Never carries internal detail (FR-056).
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, example: forbidden }
            message: { type: string }

    ValidationError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, fields]
          properties:
            code: { type: string, enum: [validation_failed] }
            message: { type: string }
            fields:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, message]
                properties:
                  field: { type: string, example: phone }
                  message: { type: string, example: Enter a valid phone number. }

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 128 }

    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, email, role, status, first_name, last_name, photo_url]
      description: The minimum the interface needs to render for a signed-in person.
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        first_name: { type: string }
        last_name: { type: string }
        photo_url:
          type: [string, 'null']
          description: |
            API-relative path, resolved against this document's server base path. A client
            rendering it in a DOM `src` MUST prefix its own API base URL. Null when no photo is
            stored; the interface shows the default avatar.
        active_trainer_id:
          type: [string, 'null']
          format: uuid
          description: |
            Player/Parent only, and null for every other role and for a player who belongs to
            no trainer. The context every player-facing read is scoped to. Changed only through
            `PUT /me/trainer-context` — no other endpoint accepts a trainer identifier (R-25).
        trainer_count:
          type: integer
          default: 0
          description: |
            How many switchable trainers the caller has. The interface shows the switcher only
            above one (FR-088). Zero for every non-player role.
        portal_branding:
          $ref: '#/components/schemas/PortalBranding'
          description: |
            The branding to paint for this viewer, resolved server-side: a trainer's own, a
            player's active context's, the platform default otherwise (FR-101). Coaches receive
            the default until US-01.08 establishes which trainer they work for (research R-33).

    PhotoUrls:
      type: object
      additionalProperties: false
      required: [photo_url, thumbnail_url]
      description: |
        Both are API-relative paths, resolved against this document's server base path — not
        absolute URLs and not paths relative to the web application's own origin. A client
        rendering either in a DOM `src` MUST prefix its API base URL; requests issued through the
        API client resolve without further work.
      properties:
        photo_url: { type: string }
        thumbnail_url: { type: string }

    TrainerDetail:
      type: object
      additionalProperties: false
      required: [business_name]
      properties:
        business_name: { type: string, minLength: 1, maxLength: 200 }
        address: { type: [string, 'null'], maxLength: 500 }
        website: { type: [string, 'null'], maxLength: 500, format: uri }
        description: { type: [string, 'null'], maxLength: 2000 }

    CoachDetail:
      type: object
      additionalProperties: false
      required: [is_publicly_visible]
      properties:
        bio: { type: [string, 'null'], maxLength: 2000 }
        credentials: { type: [string, 'null'], maxLength: 1000 }
        certifications: { type: [string, 'null'], maxLength: 1000 }
        is_publicly_visible: { type: boolean }

    PlayerParentDetail:
      type: object
      additionalProperties: false
      properties:
        school: { type: [string, 'null'], maxLength: 200 }
        jersey_number: { type: [string, 'null'], maxLength: 10 }
        skill_level:
          type: [string, 'null']
          readOnly: true
          description: Assigned by a trainer in a later feature. Never writable here (FR-007, FR-033).
        emergency_contact_name: { type: [string, 'null'], maxLength: 200 }
        emergency_contact_phone: { type: [string, 'null'], maxLength: 32 }
        emergency_contact_relation: { type: [string, 'null'], maxLength: 100 }

    RoleDetail:
      description: |
        The role-specific block. Discriminated by the account's role, so the frontend narrows
        it with a type guard rather than reaching for `any` (constitution Principle II).
      oneOf:
        - $ref: '#/components/schemas/TrainerDetail'
        - $ref: '#/components/schemas/CoachDetail'
        - $ref: '#/components/schemas/PlayerParentDetail'
        - type: 'null'
          description: Super Admin accounts carry no role detail block.

    OwnProfile:
      type: object
      additionalProperties: false
      required: [id, email, role, status, created_at, first_name, last_name, phone, photo_url, thumbnail_url, role_detail, editable_fields]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, readOnly: true }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        created_at: { type: string, format: date-time, readOnly: true }
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: [string, 'null'] }
        photo_url: { type: [string, 'null'], description: API-relative; see PhotoUrls. }
        thumbnail_url: { type: [string, 'null'], description: API-relative; see PhotoUrls. }
        role_detail: { $ref: '#/components/schemas/RoleDetail' }
        editable_fields:
          type: array
          description: |
            Names of the fields this role may change. Everything else the payload carries is
            read-only. Reported by the server so the interface cannot drift from the rule
            the server actually enforces (FR-031, FR-033).
          items: { type: string }
          example: [first_name, last_name, phone, school, jersey_number]

    OwnProfileUpdate:
      type: object
      additionalProperties: false
      description: |
        Every field optional — a partial update. Submitting a field not editable for the
        requester's role is a 422, not a silent no-op (FR-033).

        An omitted key leaves its stored value untouched. A key present with value `null` clears
        the stored value. The empty string is not a way to say "no value" and is rejected with a
        422 naming the field (FR-059). `first_name` and `last_name` may be omitted but may not be
        sent as `null` — both are required.
      properties:
        first_name: { type: string, minLength: 1, maxLength: 100 }
        last_name: { type: string, minLength: 1, maxLength: 100 }
        phone: { type: [string, 'null'], minLength: 1, maxLength: 32 }
        business_name: { type: string, minLength: 1, maxLength: 200 }
        address: { type: [string, 'null'], minLength: 1, maxLength: 500 }
        website: { type: [string, 'null'], minLength: 1, maxLength: 500 }
        description: { type: [string, 'null'], minLength: 1, maxLength: 2000 }
        bio: { type: [string, 'null'], minLength: 1, maxLength: 2000 }
        credentials: { type: [string, 'null'], minLength: 1, maxLength: 1000 }
        certifications: { type: [string, 'null'], minLength: 1, maxLength: 1000 }
        is_publicly_visible: { type: boolean }
        school: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        jersey_number: { type: [string, 'null'], minLength: 1, maxLength: 10 }
        emergency_contact_name: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        emergency_contact_phone: { type: [string, 'null'], minLength: 1, maxLength: 32 }
        emergency_contact_relation: { type: [string, 'null'], minLength: 1, maxLength: 100 }

    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [role, email, first_name, last_name, phone]
      properties:
        role: { $ref: '#/components/schemas/UserRole' }
        email: { type: string, format: email, maxLength: 320 }
        first_name: { type: string, minLength: 1, maxLength: 100 }
        last_name: { type: string, minLength: 1, maxLength: 100 }
        phone:
          type: string
          minLength: 1
          maxLength: 32
          description: |
            Must parse as a real telephone number and is stored normalized to E.164 — the same
            rule the profile save applies (FR-022, data-model.md §12). A 422 attributed to
            `phone` is returned when it does not.
        business_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Required when role is trainer; rejected for any other role (FR-021).

    CreatedUser:
      type: object
      additionalProperties: false
      required: [user, invitation_sent, invitation_expires_at]
      properties:
        user: { $ref: '#/components/schemas/UserDetail' }
        invitation_sent:
          type: boolean
          description: |
            False when the account was created but the email could not be delivered. The
            Super Admin should re-invite (FR-028).
        invitation_expires_at: { type: string, format: date-time }

    UserSummary:
      type: object
      additionalProperties: false
      required: [id, email, first_name, last_name, role, status, created_at, has_password]
      description: One row of the directory (FR-051).
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        created_at: { type: string, format: date-time }
        thumbnail_url: { type: [string, 'null'], description: API-relative; see PhotoUrls. }
        has_password:
          type: boolean
          description: |
            False for an invited account that has not completed setup. Lets the directory
            offer Re-invite on exactly the rows where it applies (FR-053).

    UserDetail:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          additionalProperties: false
          required: [version, phone, role_detail, last_login_at, available_actions]
          properties:
            version:
              type: integer
              description: Echo this on any status change; a mismatch is a 409 (R-10).
            phone: { type: [string, 'null'] }
            photo_url: { type: [string, 'null'], description: API-relative; see PhotoUrls. }
            role_detail: { $ref: '#/components/schemas/RoleDetail' }
            last_login_at: { type: [string, 'null'], format: date-time }
            available_actions:
              type: array
              description: |
                Actions valid for this account's current status, so the directory shows only
                those (FR-053). Advisory for rendering; the server enforces regardless.
              items:
                type: string
                enum: [deactivate, reactivate, erase, reinvite]

    UserPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UserSummary' }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    StatusChangeRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          description: The version observed when the account was read (R-10).

    EraseUserRequest:
      type: object
      additionalProperties: false
      required: [version, reason]
      properties:
        version: { type: integer }
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Retained in the compliance record (FR-044, FR-049).

    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, action, occurred_at]
      properties:
        id: { type: string, format: uuid }
        action:
          type: string
          enum: [user_created, invitation_issued, invitation_consumed, user_deactivated, user_reactivated, user_erased, permission_denied]
        actor:
          type: [object, 'null']
          additionalProperties: false
          required: [id, display_name]
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
        reason: { type: [string, 'null'] }
        detail: { type: [string, 'null'] }
        occurred_at: { type: string, format: date-time }

    AuditPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    ErasureRecord:
      type: object
      additionalProperties: false
      required: [user_id, original_email, original_first_name, original_last_name, erased_by, reason, erased_at]
      properties:
        user_id: { type: string, format: uuid }
        original_email: { type: string }
        original_first_name: { type: string }
        original_last_name: { type: string }
        erased_by:
          type: object
          additionalProperties: false
          required: [id, display_name]
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
        reason: { type: string }
        erased_at: { type: string, format: date-time }

    # -------------------------------------------------------------------------
    # Extension (2026-08-26): ShareLink onboarding, multi-trainer, branding
    # -------------------------------------------------------------------------

    Gender:
      type: string
      enum: [male, female, other, prefer_not_to_say]
      description: Closed set so later epics can group and filter by it (R-32).

    ShareLinkKind:
      type: string
      enum: [player_standing, coach_single_use]
      description: |
        Only `player_standing` is issued by this feature. `coach_single_use` exists in the
        contract so US-01.08 is additive rather than a restructuring (FR-072).

    PortalBranding:
      type: object
      additionalProperties: false
      required: [logo_url, primary_color, updated_at]
      description: |
        One trainer's portal identity. Every value may be absent, and absent means the platform
        default — never an empty string (FR-104, constitution Principle VI).
      properties:
        logo_url:
          type: [string, 'null']
          description: |
            API-relative path under `/media/branding/`. A DOM `src` must prefix the API base
            URL, as with photo URLs. Render through `<img>` only (R-27).
        primary_color:
          type: [string, 'null']
          pattern: '^#[0-9a-f]{6}$'
          description: |
            Exactly the colour the trainer chose (R-29). The readable palette is derived by the
            client; no derived value is stored or transmitted.
        updated_at: { type: [string, 'null'], format: date-time }

    PortalBrandingUpdate:
      type: object
      additionalProperties: false
      description: |
        An omitted key changes nothing; an explicit `null` clears the value to the platform
        default. Empty string is rejected (constitution Principle VI).
      properties:
        primary_color:
          type: [string, 'null']
          pattern: '^#[0-9a-fA-F]{6}$'

    ShareLink:
      type: object
      additionalProperties: false
      required: [id, code, url, kind, is_active, use_count, expires_at, max_uses, created_at]
      description: A trainer's standing player invitation link (FR-065 – FR-069).
      properties:
        id: { type: string, format: uuid }
        code:
          type: string
          minLength: 22
          maxLength: 64
          description: |
            The code as issued. Stored in clear rather than hashed, because FR-069 requires the
            trainer to read it back at any time; R-21 argues why that is safe for this token and
            for no other in the system.
        url:
          type: string
          format: uri
          description: The absolute link, ready to copy — assembled from the configured public base URL.
        kind: { $ref: '#/components/schemas/ShareLinkKind' }
        is_active: { type: boolean }
        use_count:
          type: integer
          description: Raised by exactly one per association produced; a repeat visit raises it by zero (FR-068, FR-082).
        expires_at:
          type: [string, 'null']
          format: date-time
          description: Always null for a standing player link (FR-065).
        max_uses:
          type: [integer, 'null']
          description: Always null for a standing player link.
        created_at: { type: string, format: date-time }

    JoinLinkPreview:
      type: object
      additionalProperties: false
      required: [trainer_display_name, branding, viewer]
      description: |
        The only thing an unauthenticated caller ever learns about a trainer. No identifier, no
        contact detail, no roster size (FR-073).
      properties:
        trainer_display_name:
          type: string
          description: The organization's business name.
        branding: { $ref: '#/components/schemas/PortalBranding' }
        viewer:
          type: object
          additionalProperties: false
          required: [state]
          description: What the join page should offer, decided server-side.
          properties:
            state:
              type: string
              enum: [anonymous, can_join, already_associated, role_cannot_join]
              description: |
                `anonymous` → show the registration form. `can_join` → show one confirm button
                (FR-080). `already_associated` → say so and offer the trainer's area (FR-082).
                `role_cannot_join` → explain the link is for players and parents (FR-081).

    JoinRegistrationRequest:
      type: object
      additionalProperties: false
      required: [first_name, last_name, email, password, phone, is_self, gender, date_of_birth]
      description: |
        One account, one player. Child profiles are out of scope, so there is no list of family
        members here; the field that keeps that door open is `is_self`.
      properties:
        first_name: { type: string, minLength: 1, maxLength: 100 }
        last_name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 320 }
        password: { $ref: '#/components/schemas/Password' }
        phone:
          type: string
          minLength: 1
          maxLength: 32
          description: Parseable to E.164, stored normalized — the same rule as every other write path.
        is_self:
          type: boolean
          description: |
            True when the account holder is the player; false when they are registering someone
            they are responsible for. Selects which age band applies (FR-077).
        player_name:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
          description: |
            Required when `is_self` is false. Null when the account holder is the player — the
            name is then read from the profile rather than copied (FR-074).
        date_of_birth:
          type: string
          format: date
          description: |
            The age FR-077 constrains is derived from this: 18 or above when `is_self`, between
            1 and 18 when not. Stored as a date so it does not decay (R-31).
        gender: { $ref: '#/components/schemas/Gender' }

    TrainerContextEntry:
      type: object
      additionalProperties: false
      required: [trainer_id, display_name, branding, joined_at]
      properties:
        trainer_id: { type: string, format: uuid }
        display_name: { type: string }
        branding: { $ref: '#/components/schemas/PortalBranding' }
        joined_at: { type: string, format: date-time }

    TrainerContextList:
      type: object
      additionalProperties: false
      required: [active_trainer_id, trainers]
      description: |
        The switcher's whole state. `trainers` holds only Active associations with Active
        trainers, so every entry is switchable (FR-089). One entry means no switcher is shown
        (FR-088); an empty list means the person belongs to no trainer, which is valid.
      properties:
        active_trainer_id:
          type: [string, 'null']
          format: uuid
          description: Null only when `trainers` is empty.
        trainers:
          type: array
          items: { $ref: '#/components/schemas/TrainerContextEntry' }

    TrainerContextRequest:
      type: object
      additionalProperties: false
      required: [trainer_id]
      properties:
        trainer_id: { type: string, format: uuid }

    JoinResult:
      type: object
      additionalProperties: false
      required: [trainer_id, trainer_display_name, already_associated, active_trainer_id]
      properties:
        trainer_id: { type: string, format: uuid }
        trainer_display_name: { type: string }
        already_associated:
          type: boolean
          description: True when the caller was already connected. Nothing was written and the use count did not move (FR-082).
        active_trainer_id:
          type: string
          format: uuid
          description: The context the caller is now in — the link's trainer.

    TrainerPlayerSummary:
      type: object
      additionalProperties: false
      required: [player_user_id, display_name, is_self, joined_at, photo_url]
      description: |
        One row of a trainer's roster. Deliberately carries nothing about the player's other
        trainers — not an identifier, not a count (FR-090, SC-025).
      properties:
        player_user_id: { type: string, format: uuid }
        display_name:
          type: string
          description: The player's name, or "Deleted User" for an erased account (FR-091).
        is_self: { type: boolean }
        age:
          type: [integer, 'null']
          description: Derived from the stored date of birth; null once erased (R-31).
        gender: { type: [string, 'null'] }
        joined_at: { type: string, format: date-time }
        photo_url: { type: [string, 'null'] }

    TrainerPlayerPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TrainerPlayerSummary' }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
