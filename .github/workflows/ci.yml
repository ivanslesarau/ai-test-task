name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: .venv/bin/ruff check .

      - name: Format check (ruff format)
        run: .venv/bin/ruff format --check .

      - name: Type check (mypy, strict)
        run: .venv/bin/mypy src

      - name: Test (unit + integration + contract)
        run: .venv/bin/pytest -q

      # constitution: No Raw SQL outside the two documented exceptions
      # (plan.md §Complexity Tracking — db/engine.py's PRAGMAs and the
      # 0004 migration's append-only triggers).
      - name: No undocumented raw SQL
        run: |
          if grep -rn '\.execute("' src/app --include=*.py | grep -v "db/engine.py"; then
            echo "::error::Raw SQL found outside the two documented exceptions"
            exit 1
          fi

      # research.md R-25: context is resolved server-side from the
      # caller's own row via get_trainer_context — no endpoint accepts a
      # trainer_id request parameter to select it (the admin user
      # directory's {user_id} path param is a different, pre-existing
      # concept and is excluded).
      - name: No trainer_id request parameter outside the admin router
        run: |
          if grep -rn "trainer_id" src/app/api/ | grep -v "admin_users_router" | grep "Query\|Path("; then
            echo "::error::A trainer_id request parameter was found outside admin_users_router — context must be server-resolved (research.md R-25)"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint — includes no-explicit-any and FSD import boundaries)
        run: npm run lint

      - name: Type check (tsc --noEmit, strict)
        run: npm run typecheck

      - name: Test (vitest)
        run: npm run test

      - name: Build
        run: npm run build

      # constitution: centralize axios in shared/api — no direct imports
      # from UI components (Technology Stack & Constraints, Frontend
      # API & Requests rule).
      - name: No axios imports outside shared/api
        run: |
          if grep -rn "from 'axios'" src | grep -v "shared/api"; then
            echo "::error::axios imported outside shared/api"
            exit 1
          fi

      # constitution Principle VI: exactly one empty-string-to-null
      # normalizer exists, and every TanStack Form submit handler routes
      # through it — a second normalizer, or an inline ternary/`|| null`
      # at a submit call site, is the failure mode this catches.
      - name: Every form submit handler uses the shared normalizer
        run: |
          missing=0
          for f in $(grep -rl "onSubmit:" src/features --include=*.tsx); do
            if ! grep -q "normalize-payload" "$f"; then
              echo "::error file=$f::Submit handler does not import shared/lib/normalize-payload"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

          count=$(grep -rl "export function normalizeEmptyToNull" src | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one normalizeEmptyToNull definition, found $count"
            exit 1
          fi

          if grep -rnE "\?\s*[a-zA-Z0-9_.\[\]'\"]+\s*:\s*null|\|\|\s*null" src/features --include=*.tsx; then
            echo "::error::Inline empty-string-to-null conversion found at a submit call site — route through normalizeEmptyToNull instead"
            exit 1
          fi

      # research.md R-27: a logo is rendered through <img> only. <object>,
      # <embed>, and inline SVG (dangerouslySetInnerHTML) all let an SVG
      # execute script in the browser — the layer of defence that must
      # hold even if the backend's screening is wrong.
      - name: Logos are rendered through <img> only
        run: |
          if grep -rn "branding" src --include=*.tsx | grep -E "<object|<embed|dangerouslySetInnerHTML"; then
            echo "::error::A logo appears to be rendered outside <img> — see research.md R-27"
            exit 1
          fi
